<!-- design-canvas — the pane.
     A live Claude Design canvas, seeded on disk by this component's service and
     delivered to the browser through GET /api/components/<payload_component>
     (CONTRACT §7). This file renders the chrome, the frame, the pin overlay and
     one screen per state; it never carries canvas bytes itself.

     BYTE BUDGET: **at most 128 KB**, half the hard 256 KB tripwire ceiling
     (CONTRACT §8.4). It is ~96 KB today: ~18 KB of style and markup, 13 KB that
     is the verbatim inline of `scratch/anchor-lib.js` (a component installs
     exactly four files, so the pane cannot import it — CONTRACT §1.2/§5.1), and
     the rest this script. What actually matters is not the number but the rule
     behind it: the 2.4 MB canvas is NOT in this file and must never be. Pane
     `html` is snapshotted into every committed graph node, so a payload here
     would be copied into every node on disk, forever (FINDINGS §8). It arrives
     at runtime, over fetch, and goes straight into an iframe's `srcdoc`.

     Two failure modes kill a pane silently; both are avoided here:
       - the script body is compiled as `new Function('store','root','params','mountId', body)`
         (`public/mount-runtime.js:95-105`), so top-level `await` is a SyntaxError
         and the pane never runs. Every `await` here sits inside an async
         function — the IIFE in run(), or an async event handler.
       - `document.querySelector` cannot see into the shadow root. Every query
         goes through `root`. `document.createElement` is fine and is used
         throughout in preference to innerHTML, because much of what is rendered
         here came out of a canvas the pane does not trust (CONTRACT §9.3).
-->

<script>
  /* Injected globals: store, root, params, mountId. This pane lives in a shadow
     root — never document.querySelector / getElementById.

     Compiled as `new Function('store','root','params','mountId', body)`, so
     nothing below may use top-level `await`, `import` or `export`. */

  /* The anchor library, copied VERBATIM from `scratch/anchor-lib.js`.

     A component installs exactly four files (CONTRACT §1.2, §9.4) and a pane
     script has no module system (CONTRACT §5.1), so the library cannot be
     imported and this is a copy. That file is the source of truth: edit it
     there, re-run `node --test test/uc-port.test.mjs` — which proves the port
     byte-identical to the payload's own `Uc`/`ZP`/`QP` and compiles the file
     exactly the way this pane is compiled — then re-inline it here. The two
     marker lines below delimit the copy; how to extract and diff it is written
     at the end marker. */
  /* @@ANCHOR-LIB-BEGIN@@ */
// ---------------------------------------------------------------------------
// anchor-lib — the anchor grammar of Claude Design's canvas editor, ported.
//
// SOURCE OF TRUTH. THIS FILE IS INLINED, NOT IMPORTED.
//
// A web-chat component installs exactly four files (CONTRACT §1.2, §9.4), so
// `component.html` cannot `import` a helper from this repo. The pane script is
// compiled as `new Function('store','root','params','mountId', body)`
// (CONTRACT §5.1), which has no module system at all. So this file is the
// authoritative copy and its body is COPIED verbatim into the pane script.
// Edit it here, re-run `node --test test/uc-port.test.mjs`, then re-inline.
//
// Constraints this file is written to satisfy, so the copy is mechanical:
//   - no `import` / `export` / top-level `await` — it must compile as the body
//     of a `new Function(...)`, where any of those is a SyntaxError that fails
//     near-silently (CONTRACT §5.1).
//   - exactly one identifier leaks into the pane scope: `DsnAnchor`.
//   - no `document.*` — nothing here touches the DOM.
//   - the trailing `module.exports` line is guarded and is inert in a pane
//     (`typeof module` is 'undefined' there); it exists only so Node tooling
//     can require this file directly.
//
// PROVENANCE. Every constant and every function below is a port of a named
// symbol in Claude Design's `payload.template.html`, read from the user's own
// local install. No upstream bytes are reproduced here beyond the short
// expressions the port necessarily restates (CONTRACT §9.1). The port is
// proven byte-identical to the payload's own implementation by
// `test/uc-port.test.mjs`, which extracts the payload's version at test time
// from the LOCAL install and never from a committed copy (CONTRACT §8.2).
// If that test fails, this file is wrong — not the test.
//
// Upstream symbol map (minified names as of Claude Code 2.1.263 /
// payload sha256 76a2b0a4…; the names are minifier output and WILL churn, so
// the test locates them by shape, never by name):
//
//   Uc   → fileHash12          cyrb53, low 12 hex digits of the 53-bit value
//   ZP   → fraction4           round(clamp01(v) * 9999), zero-padded to 4
//   JP   → fractionFrom4       Number(s) / 9999
//   QP   → anchorSegment       (kind, payload) => "dc"+kind+payload+":nth-of-type(1)"
//   dE   → artboardAnchor      the mint site, artboard branch
//   fE   → parseArtboardAnchor the parse site, artboard branch
//   Die  → FINAL_SEGMENT_RE
//   _ie  → PLAIN_SEGMENT_RE
//   Aie  → ID_SEGMENT_RE
//   Pie  → NTH_OF_TYPE (1)
//   ZCe  → FILE_HASH_HEX (12)
//   Oie  → MAX_ANCHOR_SEGMENTS (10)
//
// WHAT THIS FILE IS NOT. It does not sanitise `anchor.text`. CONTRACT §4.4
// caps the label at 60 characters and forbids deriving it from frame DOM text;
// that is the pane's job at the call site, because the label is untrusted input
// from inside the same-origin frame (CONTRACT §9.3) and this module never sees
// the frame.
// ---------------------------------------------------------------------------

const DsnAnchor = (function () {
  // --- constants, all mirrored from the payload -----------------------------

  // ZCe — how many hex digits of the 53-bit hash survive into an anchor.
  const FILE_HASH_HEX = 12;

  // ZP — a fraction is stored as an integer 0…9999, zero-padded to 4 digits.
  const FRACTION_SCALE = 9999;
  const FRACTION_DIGITS = 4;

  // Pie — the payload mints every synthetic segment with this index and its
  // parser REFUSES any other value, so it is a constant and not a parameter.
  const NTH_OF_TYPE = 1;

  // The four anchor kinds the payload's grammar admits. v0.1.0 mints only 'a'.
  const KIND_ELEMENT = 'e';
  const KIND_ARTBOARD = 'a';
  const KIND_NOTE = 'n';
  const KIND_CANVAS_POINT = 'c';

  // CONTRACT §4.3 / payload dE + fE. The web-chat server stores `anchor`
  // verbatim with zero validation, so this is the only gate there is.

      tip = 'dsn_canvas.state = ' + (st || '(none)') + '  ·  ok = ' + String(canvas.ok !== false);
    }
    if (IS_PREVIEW) { label = 'preview'; tone = ''; tip = 'A still of a graph node: no frame, no fetch.'; }
    els.badge.textContent = label;
    els.badge.className = 'dc-badge' + (tone ? ' ' + tone : '');
    els.badge.title = tip;

    els.sub.replaceChildren();
    const bits = [];
    const n = artboards().length;
    if (n) bits.push([String(n), ' artboard' + (n === 1 ? '' : 's')]);
    const f = arr(files && files.files).length;
    if (f) bits.push([String(f), ' file' + (f === 1 ? '' : 's') + ' on disk']);
    if (canvas && canvas.bytes) bits.push([fmtBytes(canvas.bytes), ' canvas']);
    if (canvas && canvas.seeded_at) bits.push([relTime(canvas.seeded_at), ' seeded']);
    const up = obj(canvas && canvas.upstream);
    if (up && up.version) bits.push(['Claude Code ' + s(up.version), '']);
    for (let i = 0; i < bits.length; i++) {
      if (i) els.sub.appendChild(document.createTextNode('·'));
      const span = el('span');
      span.appendChild(el('b', null, bits[i][0]));
      if (bits[i][1]) span.appendChild(document.createTextNode(bits[i][1]));
      els.sub.appendChild(span);
    }
    if (up && up.payload_sha256) {
      const sha = el('span', null, 'payload ' + s(up.payload_sha256).slice(0, 8));
      sha.title = 'sha256 ' + s(up.payload_sha256);
      els.sub.appendChild(document.createTextNode('·'));
      els.sub.appendChild(sha);
    }

    const canPin = loadState === 'ok' && !ISOLATE && !IS_PREVIEW;
    els.pinBtn.disabled = !canPin;
    els.pinBtn.className = 'dc-btn dc-btn-s' + (armed ? ' on' : '');
    els.pinBtn.textContent = armed ? 'Pin mode: on' : 'Pin mode';
    els.pinBtn.title = ISOLATE
      ? 'Off in isolate mode: an opaque-origin frame cannot be read, so there is no artboard geometry to pin against.'
      : (canPin
        ? 'Arm a click-to-pin overlay over the canvas. While it is armed the canvas cannot be panned or zoomed.'
        : 'Available once the canvas is on screen.');
    els.reseedBtn.disabled = offline();
    els.reseedBtn.title = offline()
      ? 'Nothing is listening here — this is a snapshot, not the live surface.'
      : 'Re-run the seeding helper over the current files (dsn_ctl op reseed). Always safe.';
    els.askBtn.disabled = offline();
    els.askBtn.title = offline()
      ? 'Nothing is listening here — this is a snapshot, not the live surface.'
      : (ASK_DECLARED
        ? 'Write a note on dsn_ask, the pane’s one declared signal. It waits in the queue rail until you Push (P).'
        : 'dsn_ask is not declared as a signal on this mount, so a note written here does not reach the queue rail. ' + ASK_UNDECLARED_WHY);
    els.filesBtn.className = 'dc-btn dc-btn-s' + (filesOpen ? ' on' : '');
    els.askBtn.className = 'dc-btn dc-btn-s dc-btn-go' + (askOpen ? ' on' : '');

    paintBanner();
    paintFiles();
    paintAsk();
  }

  function bn(kind, iconName, parts) {
    const b = el('div', 'dc-bn' + (kind ? ' ' + kind : ''));
    b.appendChild(icon(iconName));
    b.appendChild(line(el('div'), parts));
    return b;
  }
  function paintBanner() {
    const out = [];
    if (ISOLATE && !IS_PREVIEW) {
      out.push(bn('', 'off', ['Isolate mode: the canvas frame is sandboxed to an opaque origin, so it is viewer-only and ',
        ['b', null, 'pins are off'],
        '. Nothing inside it can reach this daemon — the trade is that nothing here can read its artboard geometry either.']));
    }
    if (!SECURE && !IS_PREVIEW) {
      out.push(bn('warn', 'warn', ['This surface is not a secure context (', ['code', null, ORIGIN || 'this origin'],
        '), so the canvas cannot run here. Open it on ', ['code', null, 'http://localhost'], ' or ',
        ['code', null, 'http://127.0.0.1'], ' instead.']));
    }
    if (booted === false) {
      out.push(bn('warn', 'warn', ['The canvas loaded but no artboards appeared in it. Reseed, or ask Claude to run the helper’s ',
        ['code', null, '--check'], ' over the working files.']));
    }
    // Additive fields the service publishes beyond CONTRACT §2.1/§2.2. A canvas
    // that seeded with warnings is not a canvas that seeded cleanly, and the
    // helper's advisory stderr is the only place that difference is visible.
    const warns = arr(canvas && canvas.warnings).map((w) => s(w).trim()).filter(Boolean);
    if (warns.length) {
      const b = el('div', 'dc-bn warn');
      b.appendChild(icon('warn'));
      const t = el('div');
      t.appendChild(el('b', null, 'The helper seeded this canvas, with warnings.'));
      for (const w of warns.slice(0, 5)) t.appendChild(el('div', 'dc-mono', w.slice(0, 400)));
      if (warns.length > 5) t.appendChild(el('div', 'dc-fine', '+ ' + (warns.length - 5) + ' more'));
      b.appendChild(t);
      out.push(b);
    }
    if (!canvas && escalated) {
      out.push(bn('warn', 'warn', ['Nothing from the design-canvas service yet. If it has not been approved on this machine, run ',
        ['code', null, TRUST],
        ' in your terminal — a pane can name that command but cannot grant it. A service also runs only while its pane is on the active node with a browser watching.']));
    }
    els.banner.hidden = !out.length;
    els.banner.replaceChildren.apply(els.banner, out);
  }

  function paintFiles() {
    els.files.hidden = !filesOpen;
    if (!filesOpen) return;
    const box = els.files;
    box.replaceChildren();
    box.appendChild(el('h4', null, 'Working files'));
    const dir = s(files && files.dir);
    if (dir) { const d = el('div', 'dc-what', dir); d.title = dir; box.appendChild(d); }
    const list = arr(files && files.files);
    if (!list.length) {
      box.appendChild(el('div', 'dc-fine', files
        ? 'The service reports no files in that directory.'
        : 'The service has not published dsn_files yet.'));
    } else {
      const grid = el('div', 'dc-flist');
      for (const f of list.slice(0, 200)) {
        const n = el('div', 'n', s(f.name));
        n.title = s(f.name);
        grid.appendChild(n);
        grid.appendChild(el('div', 'v', fmtBytes(f.bytes)));
        grid.appendChild(el('div', 'v', relTime(f.mtime)));
      }
      box.appendChild(grid);
    }
    // A file sitting in the folder that is NOT on the canvas is exactly the kind
    // of silence this pack is written against, so the service's reasons are shown.
    const skipped = arr(files && files.skipped);
    if (skipped.length) {
      box.appendChild(el('div', 'dc-fine', 'In the folder, but not on the canvas:'));
      for (const sk of skipped.slice(0, 20)) {
        const row = el('div', 'dc-fine');
        row.appendChild(el('b', null, s(sk.name)));
        row.appendChild(document.createTextNode(' — ' + s(sk.reason).slice(0, 200)));
        box.appendChild(row);
      }
      if (skipped.length > 20) box.appendChild(el('div', 'dc-fine', '+ ' + (skipped.length - 20) + ' more'));
    }
    const row = el('div', 'dc-row');
    const re = btn('dc-btn dc-btn-s', 'Re-read the directory');
    re.addEventListener('click', () => { if (sendCtl('rescan')) flash('Asked the service to re-read the directory (dsn_ctl op rescan).'); });
    row.appendChild(re);
    row.appendChild(el('span', 'dc-fine',
      (files && files.has_canvas_json
        ? 'canvas.json is present, so the layout is yours. '
        : 'No canvas.json — the helper lays the artboards out itself. ') +
      (P.watch === false || P.watch === 'false'
        ? 'This pane was mounted with watch:false, so edits on disk do NOT re-seed on their own — use Reseed. '
        : 'Edits to these files re-seed the canvas on their own. ') +
      'Nothing on this surface ever writes to that directory.'));
    box.appendChild(row);
  }

  // ── ask panel: the ONE declared signal (CONTRACT §2.4) ───────────────────
  function paintAsk() {
    els.ask.hidden = !askOpen;
    if (!askOpen) return;
    const n = artboards().length;
    els.askWhat.textContent = [s(canvas && canvas.title) || s(P.title) || '(untitled)',
      n + ' artboard' + (n === 1 ? '' : 's'),
      'state ' + (s(canvas && canvas.state) || 'unknown')].join('  ·  ');
    const want = els.askBoard.value;
    const sig = artboards().map((a) => s(a.file)).join('|');
    if (els.askBoard._sig !== sig) {
      els.askBoard._sig = sig;
      els.askBoard.replaceChildren();
      const all = el('option', null, 'the whole canvas');
      all.value = '';
      els.askBoard.appendChild(all);
      for (const a of artboards()) {
        const o = el('option', null, s(a.file));
        o.value = s(a.file);
        els.askBoard.appendChild(o);
      }
      els.askBoard.value = want;
      if (els.askBoard.value !== want) els.askBoard.value = '';
    }
  }
  function openAsk(prefillNote, artboard) {
    askOpen = true;
    paintAsk();
    if (artboard) els.askBoard.value = artboard;
    if (prefillNote && !els.askNote.value.trim()) {
      els.askNote.value = String(prefillNote);
      // A programmatic write fires nothing on its own, and composed:true is what
      // carries the event through the shadow boundary to the shell's form-state
      // capture — without it the note would not survive a refresh.
      els.askNote.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
    }
    paintHead();
    els.askNote.focus();
  }
  function sendAsk() {
    const board = s(els.askBoard.value);
    const payload = {
      seq: nextSeq('dsn_ask'),
      note: String(els.askNote.value || '').slice(0, 2000),
      artboard: board || null,
    };
    try { store.set({ dsn_ask: payload }); }
    catch (e) { return flash('Could not write dsn_ask: ' + s(e && e.message), true); }
    els.askNote.value = '';
    els.askNote.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
    els.askNote.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
    askOpen = false;
    paintHead();
    // Only claim the handoff that will actually happen. Without the declaration
    // this write reaches nothing at all (see ASK_DECLARED), and an empty queue
    // rail after a confident "queued" is worse than no button.
    flash(ASK_DECLARED
      ? 'Queued on dsn_ask — hit Push (P) in the right-hand rail to hand it over.'
      : 'Written to dsn_ask, but NOT queued. ' + ASK_UNDECLARED_WHY, !ASK_DECLARED);
  }

  els.askBtn.addEventListener('click', () => {
    if (askOpen) { askOpen = false; paintHead(); } else openAsk();
  });
  els.ask.querySelector('[data-ask-cancel]').addEventListener('click', () => { askOpen = false; paintHead(); });
  els.ask.querySelector('[data-ask-send]').addEventListener('click', sendAsk);
  els.filesBtn.addEventListener('click', () => { filesOpen = !filesOpen; paintHead(); });
  els.reseedBtn.addEventListener('click', () => {
    if (sendCtl('reseed')) flash('Asked the service to re-seed. The frame reloads when it publishes.');
  });
  els.pinBtn.addEventListener('click', () => setArmed(!armed));

  // ═════════════════════════════════════════════════════════════════════════
  // STATE SCREENS — every state gets a distinct, useful one (CONTRACT §3)
  // ═════════════════════════════════════════════════════════════════════════
  function screen(kind, iconName, head, paras) {
    const box = el('div', 'dc-screen' + (kind ? ' ' + kind : ''));
    box.appendChild(icon(iconName, 'dc-ic-b'));
    box.appendChild(el('div', 'dc-h', head));
    for (const p of arr(paras)) box.appendChild(line(el('p', 'dc-p'), Array.isArray(p) ? p : [p]));
    return box;
  }
  function bar() { const b = el('div', 'dc-bar'); b.appendChild(el('i')); return b; }
  function actions(box, specs) {
    const row = el('div', 'dc-btns');
    for (const spec of specs) {
      if (!spec || !spec[0]) continue;
      const b = btn('dc-btn' + (spec[2] ? ' ' + spec[2] : ''), spec[0]);
      b.addEventListener('click', spec[1]);
      row.appendChild(b);
    }
    box.appendChild(row);
    return box;
  }
  function artboardCards() {
    const list = artboards();
    if (!list.length) return null;
    const grid = el('div', 'dc-cards');
    for (const a of list.slice(0, 60)) {
      const c = el('div', 'dc-card');
      const n = el('div', 'n', s(a.file));
      n.title = s(a.file);
      c.appendChild(n);
      const w = num(a.w), h = num(a.h);
      c.appendChild(el('div', 'm', w != null && h != null
        ? Math.round(w) + ' × ' + Math.round(h)
        : 'laid out by the helper'));
      grid.appendChild(c);
    }
    return grid;
  }
  function filesCards() {
    const list = arr(files && files.files);
    if (!list.length) return null;
    const grid = el('div', 'dc-cards');
    for (const f of list.slice(0, 60)) {
      const c = el('div', 'dc-card');
      const n = el('div', 'n', s(f.name));
      n.title = s(f.name);
      c.appendChild(n);
      c.appendChild(el('div', 'm', fmtBytes(f.bytes)));
      grid.appendChild(c);
    }
    return grid;
  }
  function showScreen(node) { teardownFrame(); els.stage.replaceChildren(node); }
  const reseedAction = () => ['Reseed', () => { if (sendCtl('reseed')) flash('Asked the service to re-seed.'); }];
  const askAction = (prefill) => ['Ask Claude', () => openAsk(prefill), 'dc-btn-go'];
  const retryAction = () => ['Retry', () => { loadedKey = null; loadState = 'idle'; run(); }];

  function paintStage() {
    if (IS_PREVIEW) return showScreen(previewScreen());
    if (!canvas) return showScreen(waitingScreen());

    const st = s(canvas.state);
    if (st === 'no-payload') return showScreen(noPayloadScreen());
    if (st === 'bad-dir') return showScreen(badDirScreen());
    if (st === 'seed-failed') return showScreen(seedFailedScreen());
    if (st === 'live-store') return showScreen(liveStoreScreen(canvas.error, canvas.hint));
    if (st === 'seeding') return showScreen(seedingScreen());
    if (st !== 'ready' || canvas.ok === false) return showScreen(unknownStateScreen());

    // The secure-context check happens BEFORE any frame is created.
    if (!SECURE) return showScreen(insecureScreen());

    if (loadState === 'live-store') return showScreen(liveStoreScreen(
      'The carrier the service wrote still has store:"db" in its own state block.', null));
    if (loadState === 'net') return showScreen(exportScreen());
    if (loadState === 'http') return showScreen(carrierScreen());
    if (loadState === 'noname') return showScreen(actions(screen('bad', 'warn',
      'The service named no payload component',
      ['dsn_canvas says ready but carries no payload_component, so there is nothing to fetch.']),
      [reseedAction()]));
    if (loadState === 'badname') return showScreen(badCarrierScreen());
    if (loadState === 'empty' || loadState === 'not-canvas') return showScreen(notCanvasScreen());
    if (loadState !== 'ok') return showScreen(loadingScreen());
    showFrame();
  }

  // — node preview / glance card (CONTRACT §5.2) —
  function previewScreen() {
    const box = screen('', 'canvas', s(canvas && canvas.title) || s(P.title) || 'Design canvas', [
      ['This is a still of a graph node. Previews are served with ', ['code', null, "default-src 'none'"],
        ' and ', ['code', null, "connect-src 'none'"],
        ', so the canvas frame and the fetch that fills it are both dead here. An empty box would just look broken; this is what there actually is.'],
      'Open the live surface to pan, zoom and pin on it.',
    ]);
    const cards = artboardCards();
    if (cards) box.insertBefore(cards, box.querySelector('p'));
    return box;
  }

  // — nothing on dsn_canvas yet —
  function waitingScreen() {
    const box = screen('', 'canvas', 'Waiting for the design-canvas service', [
      'The service owns seeding and file watching; this pane renders what it publishes on dsn_canvas.',
    ]);
    box.insertBefore(bar(), box.querySelector('p'));
    if (escalated) {
      box.appendChild(line(el('p', 'dc-p'),
        ['Still nothing. A host service does not start until it is approved once, in your terminal:']));
      box.appendChild(el('div', 'dc-pre', TRUST));
      box.appendChild(line(el('p', 'dc-p'), ['That approval is keyed on the project, the service’s own source and its params, so editing it or changing ',
        ['code', null, 'dir'], ' asks again. A service also runs only while its pane is on the active node with a browser watching.']));
    }
    return box;
  }

  // — state: no-payload —
  function noPayloadScreen() {
    const box = screen('warn', 'warn', 'Claude Design is not on this machine yet', [
      s(canvas.error) || 'The canvas editor is written into a temp directory the first time Claude Code’s bundled design skill runs in a session. This pack never ships it and never extracts it.',
    ]);
    box.appendChild(el('div', 'dc-pre', s(canvas.hint) || 'Run `/design` once in Claude Code.'));
    box.appendChild(line(el('p', 'dc-p'), ['That is the whole fix: one ', ['code', null, '/design'],
      ' run materialises the editor, then reseed here. It is a first-class answer, not a fallback — this pane reads the copy Claude Code itself wrote for you.']));
    return actions(box, [reseedAction(),
      askAction('The design-canvas pane says Claude Design has not been materialised on this machine.')]);
  }

  // — state: bad-dir —
  function badDirScreen() {
    const box = screen('bad', 'warn', 'That directory is not a canvas', [
      s(canvas.error) || 'The dir param is missing, holds no artboards, or resolved outside the project.',
    ]);
    if (canvas.hint) box.appendChild(el('div', 'dc-pre', s(canvas.hint)));
    box.appendChild(line(el('p', 'dc-p'), ['A canvas directory needs at least one ', ['code', null, '<Name>.dc.html'], '. ',
      ['code', null, 'canvas.json'], ' is optional and images are picked up automatically. The path is fenced to the project: a ',
      ['code', null, 'dir'], ' that escapes it is refused outright rather than quietly re-pointed somewhere else.']));
    return actions(box, [askAction('The design-canvas pane reports bad-dir: ' + s(canvas.error))]);
  }

  // — state: seed-failed. The helper's stderr IS the answer here — it is written
  //   to be read, so it is shown verbatim and never summarised or truncated. —
  function seedFailedScreen() {
    const box = screen('bad', 'warn', 'The seeding helper refused', [
      s(canvas.error) || 'The helper exited non-zero. Its own diagnostics follow, verbatim.',
    ]);
    if (canvas.hint) box.appendChild(el('div', 'dc-pre', s(canvas.hint)));
    return actions(box, [reseedAction(),
      askAction('The seeding helper failed. Its stderr was:\n\n' + s(canvas.hint || canvas.error))]);
  }

  // — state: live-store (CONTRACT §3, §5.4) —
  function liveStoreScreen(err, hint) {
    const box = screen('bad', 'off', 'That is a live-store canvas, not ours', [
      s(err) || 'Its state block carries store:"db", so it boots read-only against a Firestore-shaped live store no matter what a host offers it.',
      ['This pane only ever shows canvases seeded from ', ['code', null, '.dc.html'],
        ' files on your own disk — never a published Artifact, never someone else’s canvas. Refusing this one is the invariant working, not a bug.'],
    ]);
    if (hint) box.appendChild(el('div', 'dc-pre', s(hint)));
    return actions(box, [reseedAction()]);
  }

  // — state: seeding —
  function seedingScreen() {
    const box = screen('', 'canvas', 'Seeding “' + (s(canvas.title) || s(P.title) || 'this canvas') + '”', [
      'The helper is folding your working files into a copy of the editor. The transform is purely textual and it never writes to your directory.',
    ]);
    box.insertBefore(bar(), box.querySelector('p'));
    const cards = artboardCards() || filesCards();
    if (cards) box.appendChild(cards);
    return box;
  }

  function unknownStateScreen() {
    const box = screen('warn', 'warn', 'The service reported a state this pane does not know', [
      'dsn_canvas.state = ' + (s(canvas.state) || '(none)') + ', ok = ' + String(canvas.ok !== false) + '.',
      s(canvas.error) || 'No error text came with it.',
    ]);
    if (canvas.hint) box.appendChild(el('div', 'dc-pre', s(canvas.hint)));
    return actions(box, [reseedAction(), askAction('The design-canvas pane got an unknown state: ' + s(canvas.state))]);
  }

  // — non-secure context (CONTRACT §5.2, FINDINGS §5) —
  function insecureScreen() {
    return screen('warn', 'warn', 'This origin cannot run the canvas', [
      ['The editor needs a secure context, and ', ['code', null, ORIGIN || 'this origin'], ' is not one: ',
        ['code', null, 'crypto.randomUUID'],
        ' is undefined there, the artboard handshake throws, and the canvas hangs on a spinner with its toolbar drawn — which looks like a slow load and never finishes.'],
      ['Working origins are ', ['code', null, 'http://localhost'], ', ', ['code', null, 'http://127.0.0.1'], ', any ',
        ['code', null, '*.localhost'], ', any ', ['code', null, 'https://'], ' and ', ['code', null, 'file://'],
        '. A LAN IP, a bare hostname, or an mDNS ', ['code', null, '.local'], ' name is not.'],
      'The frame is deliberately not mounted here: a permanent spinner would tell you less than this does.',
    ]);
  }

  function loadingScreen() {
    const box = screen('', 'canvas', 'Fetching the canvas', [
      ['It arrives over ', ['code', null, 'GET /api/components/' + s(canvas && canvas.payload_component)],
        ' — same origin, no new listener — and goes straight into the frame. It never enters this pane’s html or the store, because both are snapshotted into every committed graph node.'],
    ]);
    box.insertBefore(bar(), box.querySelector('p'));
    if (canvas && canvas.bytes) box.appendChild(el('div', 'dc-fine', 'about ' + fmtBytes(canvas.bytes)));
    return box;
  }

  // — the fetch rejected. In a frozen export that is the ONLY possible outcome:
  //   the export runtime runs pane scripts against a document with no server. —
  function exportScreen() {
    const t = s(canvas && canvas.title) || s(P.title) || 'the canvas';
    const box = screen('', 'file', 'This canvas exports as its own file', [
      ['A seeded canvas is already a self-contained, interactive document, so the right export of it is that file — ',
        ['code', null, slug(t) + '.html'],
        ' — and not a snapshot of this pane. The service writes it in its build directory; ask Claude for the exact path.'],
      ['Nothing answered ', ['code', null, '/api/components'], ' here', loadErr ? ' (' + loadErr + ')' : '',
        '. In an export that is expected. On the live surface it means the daemon is not reachable.'],
    ]);
    return actions(box, [retryAction()]);
  }
  function slug(t) {
    const out = String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
    return out || 'canvas';
  }

  function carrierScreen() {
    const box = screen('warn', 'warn', 'The canvas carrier is not there', [
      'dsn_canvas points at a component the components route will not serve: ' + (loadErr || 'it answered an error') + '.',
      ['The service writes that carrier at runtime under ', ['code', null, '<webChatDir>/components/'],
        '. It is a data carrier, not a pane — never mount it. Reseeding rewrites it, and the registry re-reads the directory on every call, so nothing needs restarting.'],
    ]);
    return actions(box, [reseedAction(), retryAction()]);
  }

  // — the store named a component that is not one of ours (CONTRACT §9.2) —
  function badCarrierScreen() {
    const box = screen('bad', 'off', 'That is not this pane’s canvas carrier', [
      ['dsn_canvas.payload_component is ', ['code', null, capFrame(loadErr) || '(empty)'],
        ', which is not a name the design-canvas service ever writes. Nothing was fetched and nothing was mounted.'],
      ['This pane only ever shows canvases seeded from ', ['code', null, '.dc.html'],
        ' files under its own ', ['code', null, 'dir'],
        ' — so the one thing it will load is the carrier its own service just wrote. Whatever put that name in the store, it was not that service.'],
    ]);
    return actions(box, [reseedAction()]);
  }

  function notCanvasScreen() {
    const box = screen('warn', 'warn', 'That carrier is not a seeded canvas', [
      loadState === 'empty'
        ? 'The components route returned no source at all.'
        : ['Its document has no ', ['code', null, 'appifact-doc'],
          ' state block, so it would boot in file mode with nothing in it. Something other than the seeding helper wrote that file.'],
    ]);
    return actions(box, [reseedAction()]);
  }

  // ═════════════════════════════════════════════════════════════════════════
  // THE FRAME
  // ═════════════════════════════════════════════════════════════════════════
  function buildWrap() {
    if (wrapNode) return wrapNode;
    wrapNode = el('div', 'dc-wrap');
    ov = el('div', 'dc-ov');
    ov.addEventListener('click', onOverlayClick);
    dockNode = el('div', 'dc-dock');
    armbar = el('div', 'dc-armbar');

  // ── geometry ────────────────────────────────────────────────────────────
  //
  // The canvas renders every artboard as one absolutely positioned box —
  //   style: { left: x, top: y - gn, width: w, height: h + gn }
  // — inside a single `translate(...) scale(...)` transform, and stamps the
  // artboard's own file key on it as `data-mega-artboard`. `gn` is a fixed

  // than through the frame's own elementFromPoint, because the canvas stacks

      // Only a small POSITIVE delta is the header hoist. Anything else means the
      // index does not describe what is on screen (a focus-mode size override, a
      // stale canvas.json), and then the raw rect is the more honest answer.

  // ═════════════════════════════════════════════════════════════════════════
  // PINS (CONTRACT §4)
  // ═════════════════════════════════════════════════════════════════════════
  function setArmed(on) {

      document.addEventListener('keydown', onArmedKey, true);

      try { shellPin = !!(document.body && document.body.classList.contains('pin-mode')); } catch (e) {}

        ? 'The surface’s own pin mode is on too — turn it off, or its pins land on this overlay instead of on the canvas.'
        : 'Pin mode armed. Click an artboard to place a pin; panning and zoom are paused until you leave.', shellPin);
      lastGeomSig = '';
      schedulePump();
    } else {

  }
  function onArmedKey(e) {

  }
  function paintArmbar() {

    armbar.replaceChildren();
    armbar.appendChild(icon('pin'));
    const t = el('span');
    t.appendChild(el('b', null, 'Pin mode is on.'));
    t.appendChild(document.createTextNode(
      ' Click an artboard to pin a comment to that point. While it is on, the canvas cannot be panned, zoomed or selected — every click lands here instead.'));

    armbar.appendChild(el('span', 'dc-sp'));

    off.addEventListener('click', () => setArmed(false));

  }

  function onOverlayClick(e) {

    const hit = hitTest(e.clientX, e.clientY);
    if (!hit) { flash('That point is not on an artboard — a pin anchors to an artboard, not to empty canvas.', true); return; }

  }
  function hitTest(cx, cy) {

  // Minted in the payload's OWN grammar (CONTRACT §4.2) so these strings hand

  function mint(hit, note) {

  async function placePin(minted, shared) {

  // A pin whose artboard is not in view is DOCKED, never dropped (CONTRACT §5.2).

  function openPinPop(p, cx, cy, a, why) {
    const pop = el('div', 'dc-pop');
    const head = el('div', 'dc-pop-h');
    head.appendChild(icon('pin'));
    head.appendChild(el('span', 'a', p.label || 'pin'));
    head.appendChild(el('span', 'dc-sp'));

    for (const r of p.replies) {

    ta.setAttribute('placeholder', 'Reply…');
    ta.setAttribute('data-no-persist', '');
    pop.appendChild(ta);
    const row = el('div', 'dc-row');
    const del = btn('dc-btn dc-btn-s', 'Remove');
    del.addEventListener('click', async () => {
      closePop();
      try {
        const r = await fetch('/api/comments/' + encodeURIComponent(p.id), { method: 'DELETE' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flash('Pin removed.');
      } catch (e) { flash('Could not remove that pin: ' + s(e && e.message), true); }
      pollPins();
    });
    row.appendChild(del);
    row.appendChild(el('span', 'dc-sp'));
    const send = btn('dc-btn dc-btn-s dc-btn-go', 'Reply');
    send.addEventListener('click', async () => {
      const text = ta.value.trim();
      if (!text) return;
      closePop();
      try {
        const r = await fetch('/api/comments/' + encodeURIComponent(p.id) + '/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, author: 'user' }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flash('Replied on ' + p.id + '.');
      } catch (e) { flash('Could not reply: ' + s(e && e.message), true); }
      pollPins();
    });
    row.appendChild(send);
    pop.appendChild(row);
    showPop(pop, cx, cy);
  }

  function showPop(pop, cx, cy) {
    closePop();
    if (!wrapNode) return;
    popEl = pop;
    wrapNode.appendChild(pop);
    let wr;
    try { wr = wrapNode.getBoundingClientRect(); } catch (e) { wr = { left: 0, top: 0, width: 320, height: 320 }; }
    const w = pop.offsetWidth || 268, h = pop.offsetHeight || 170;
    pop.style.left = Math.max(6, Math.min((cx - wr.left) + 8, wr.width - w - 6)) + 'px';
    pop.style.top = Math.max(6, Math.min((cy - wr.top) + 8, wr.height - h - 6)) + 'px';

  }
  function onOutsidePop(e) {
    if (!popEl) { document.removeEventListener('pointerdown', onOutsidePop, true); return; }
    const path = e.composedPath ? e.composedPath() : [];
    if (path.indexOf(popEl) >= 0) return;
    closePop();
  }

  // Re-project on every geometry change: pan, zoom, focus mode, a pane resize, a
  // window resize. The pump measures at most every 60 ms and only while there is
  // something to keep in place.
  function pump() {
    rafId = 0;
    if (!alive()) return stopAll();
    if (loadState !== 'ok' || (!pins.length && !armed)) return;
    const now = Date.now();
    if (now - lastMeasure >= 60) {
      lastMeasure = now;
      const g = geometry();
      const sig = geomSig(g);
      if (sig !== lastGeomSig) { lastGeomSig = sig; layoutMarkers(g); }
    }
    schedulePump();
  }
  function schedulePump() {
    if (rafId || !alive()) return;
    try { rafId = requestAnimationFrame(pump); } catch (e) { rafId = 0; }
  }
  function onResize() {
    if (!alive()) { window.removeEventListener('resize', onResize); return; }
    lastGeomSig = '';
    schedulePump();
  }

  // ═════════════════════════════════════════════════════════════════════════
  // DELIVERY (CONTRACT §7)
  // ═════════════════════════════════════════════════════════════════════════
  // Split for two reasons, both real. A literal script tag would end this script
  // early, because the shell parses pane html with the HTML parser. And the
  // fully quoted form of that id attribute is one of the upstream markers
  // scripts/check-no-vendored.mjs fails a tracked file for — so this pane
  // recognises the payload without ever writing that literal down (CONTRACT §9.1).
  const DOC_MARK = '<' + 'script type="application/json" id="appifact-doc';
  function docBlock(src) {
    const i = src.indexOf(DOC_MARK);
    if (i < 0) return null;
    const gt = src.indexOf('>', i);
    if (gt < 0) return null;
    const end = src.indexOf('<' + '/script>', gt);
    return src.slice(gt + 1, end < 0 ? Math.min(src.length, gt + 8193) : end);
  }
  // CONTRACT §5.4 / FINDINGS §4: a page whose state block still carries
  // store:"db" boots read-only against a live store no matter what a host
  // provides — it is a claude.ai/design canvas, not ours. Seeding DELETES
  // state.store, so a seeded canvas never has it. Top-level keys come first in
  // the serialised block, and a `"store":"db"` occurring inside a nested JSON
  // string would be backslash-escaped, which is what the leading guard excludes.
  // The whole block is scanned, not a prefix: key order is the payload's choice,
  // not ours, and a linear pass over even a 2 MB block costs a millisecond.
  function looksLiveStore(block) {
    return /(^|[^\\])"store"\s*:\s*"db"/.test(block);
  }

  async function ensureLoad() {
    if (IS_PREVIEW || !SECURE) return;
    const c = canvas;
    if (!c || c.ok === false || s(c.state) !== 'ready') return;
    const name = s(c.payload_component);
    if (!name) { loadState = 'noname'; repaint(); return; }
    // CONTRACT §9.2, enforced where the bytes are CHOSEN rather than assumed.
    //
    // Whatever comes back from GET /api/components/<name> is mounted as an
    // UNSANDBOXED, SAME-ORIGIN srcdoc — the realm §9.3 describes, which reads
    // private pins with their text (GET /api/comments without shared_only),
    // forges pins into my context (the `comment` branch of policy.classify has
    // no source gate and routing:'none' does not suppress it) and can POST
    // /api/packs/install. §9.2 is the invariant that makes that survivable, so
    // this pane must only ever mount the carrier its OWN service wrote.
    //
    // `payload_component` does not carry that guarantee on its own. It is an
    // ordinary store value, and the store is writable by anything that can
    // reach POST /api/store — Claude, a local driver process, another pane, and
    // (same-origin) the canvas frame itself. Unchecked, one store write points
    // this pane at any component in the registry and gets its source executed
    // in the daemon's trust realm. The name grammar is the containment rule,
    // exactly as it is for the components route itself (routes/components.js
    // `resolvable`, which is why traversal is not also a concern here).
    //
    // !! KEEP IN SYNC with service.js CARRIER_RE / carrierNameFor() !!
    // `design-canvas-payload` is the CONTRACT §2.1 base; the 8-hex suffix is
    // the mount hash the service appends so two panes on one node cannot
    // clobber each other's payload.
    if (!/^design-canvas-payload(-[0-9a-f]{8})?$/.test(name)) {
      loadedKey = null;
      loadState = 'badname';
      loadErr = capFrame(name);   // never let an unbounded store value sit in loadErr
      repaint();
      return;
    }
    // Keyed on the SEED, not on dsn_canvas.seq — seq is bumped on every write,
    // and re-fetching 2.4 MB (and resetting the user's pan and zoom) because a
    // file's mtime changed would be its own bug.
    const key = name + '@' + s(c.seeded_at);
    if (key === loadedKey) return;          // set before the first await: re-entry guard
    loadedKey = key;
    loadState = 'loading'; loadErr = ''; booted = null;
    repaint();
    let src = '';
    try {
      const r = await fetch('/api/components/' + encodeURIComponent(name), { headers: { accept: 'application/json' } });
      if (!r.ok) { loadState = 'http'; loadErr = 'HTTP ' + r.status; repaint(); return; }
      const j = await r.json();
      src = typeof j.source === 'string' ? j.source : '';
    } catch (e) {
      loadState = 'net'; loadErr = s(e && e.message); repaint(); return;
    }
    if (!alive()) return;
    if (!src) { loadState = 'empty'; repaint(); return; }
    const block = docBlock(src);
    if (block === null) { src = ''; loadState = 'not-canvas'; repaint(); return; }
    if (looksLiveStore(block)) { src = ''; loadState = 'live-store'; repaint(); return; }

    loadState = 'ok';
    paintStage();               // attaches the wrap before the frame goes into it
    mountFrame(src);
    src = '';                   // drop our reference: the frame owns those bytes now
    srcHashes.clear();
    lastGeomSig = '';
    paintHead();
    probeCanvas();
    if (!pollTimer) {
      pollTimer = setInterval(() => {
        if (!alive()) return stopAll();
        if (document.visibilityState === 'hidden') return;
        pollPins();
      }, 4000);
    }
    pollPins();
  }

  // ═════════════════════════════════════════════════════════════════════════
  // WIRING
  // ═════════════════════════════════════════════════════════════════════════
  function readStore() {
    let c = null, f = null;
    try { c = store.get('dsn_canvas'); } catch (e) {}
    try { f = store.get('dsn_files'); } catch (e) {}
    if (obj(c) && accept('dsn_canvas', c)) canvas = c;
    if (obj(f) && accept('dsn_files', f)) files = f;
  }
  function onCanvas(v) {
    if (!alive() || !obj(v) || !accept('dsn_canvas', v)) return;
    const prev = canvas;
    canvas = v;
    if (!prev || prev.seeded_at !== v.seeded_at || prev.payload_component !== v.payload_component) {
      srcHashes.clear();
    }
    // Leaving `ready` tears the frame down, so the load must be re-armed or
    // coming back to the same seed would leave an empty wrap on screen.
    if (s(v.state) !== 'ready' || v.ok === false) { loadedKey = null; loadState = 'idle'; }
    run();
  }
  function onFiles(v) {
    if (!alive() || !obj(v) || !accept('dsn_files', v)) return;
    files = v;
    paintHead();
  }

  // Everything async lives inside this call. Top-level `await` here would be a
  // SyntaxError under `new Function` and the whole pane would never run — the
  // failure mode that shows up as a pane that renders its markup and nothing
  // else (CONTRACT §5.1).
  function repaint() { paintHead(); paintStage(); }
  function run() {
    repaint();
    (async () => {
      try { await ensureLoad(); } catch (e) { console.error('design-canvas load', e); }
    })();
  }

  readStore();
  try {
    store.subscribe('dsn_canvas', onCanvas);
    store.subscribe('dsn_files', onFiles);
  } catch (e) { console.error('design-canvas subscribe', e); }
  window.addEventListener('resize', onResize);
  setTimeout(() => { if (alive() && !canvas) { escalated = true; repaint(); } }, 6000);
  run();
</script>
