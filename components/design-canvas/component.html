      const known = indexHas(raw);
      const file = known ? raw : capFrame(raw);
      if (!file) continue;
      let r = null;
      try { r = node.getBoundingClientRect(); } catch (e) { continue; }
      if (!r || r.width <= 0 || r.height <= 0) continue;
      out.push({ node: node, file: file, known: known, box: correctBox(r, known ? file : null) });
    }
    return out;
  }
  function geomSig(g) {
    if (!frame) return '';
    let fr;
    try { fr = frame.getBoundingClientRect(); } catch (e) { return ''; }
    let sig = Math.round(fr.left) + ',' + Math.round(fr.top) + ',' + Math.round(fr.width) + ',' + Math.round(fr.height);
    for (const a of g) {
      sig += '|' + a.file + ':' + Math.round(a.box.left) + ',' + Math.round(a.box.top) +
        ',' + Math.round(a.box.width) + ',' + Math.round(a.box.height);
    }
    return sig + '#' + pins.length;
  }
  // A cheap drift fingerprint (CONTRACT §4.5): the artboard's serialised source
  // as the canvas itself holds it. Each artboard renders into a sandboxed child
  // iframe whose `srcdoc` ATTRIBUTE is readable from the parent document —
  // reading an attribute is not a cross-origin read. An artboard the canvas has
  // not rendered yet has none, and unknown is NOT drift.
  function srcFingerprint(a) {
    if (!a) return null;
    if (srcHashes.has(a.file)) return srcHashes.get(a.file);
    let out = null;
    try {
      const ifr = a.node.querySelector('iframe');
      const sd = ifr && ifr.getAttribute('srcdoc');
      if (typeof sd === 'string' && sd) out = A.fileHash12(String(sd.length) + ':' + sd);
    } catch (e) { out = null; }
    if (out) srcHashes.set(a.file, out);
    return out;
  }

  // ═════════════════════════════════════════════════════════════════════════
  // PINS (CONTRACT §4)
  // ═════════════════════════════════════════════════════════════════════════
  function setArmed(on) {
    const next = !!on && loadState === 'ok' && !ISOLATE && !IS_PREVIEW && !!ov;
    if (next === armed) return;
    armed = next;
    if (ov) ov.classList.toggle('armed', armed);
    if (armed) {
      document.addEventListener('keydown', onArmedKey, true);
      paintArmbar();
      let shellPin = false;
      try { shellPin = !!(document.body && document.body.classList.contains('pin-mode')); } catch (e) {}
      flash(shellPin
        ? 'The surface’s own pin mode is on too — turn it off, or its pins land on this overlay instead of on the canvas.'
        : 'Pin mode armed. Click an artboard to place a pin; panning and zoom are paused until you leave.', shellPin);
      lastGeomSig = '';
      schedulePump();
    } else {
      document.removeEventListener('keydown', onArmedKey, true);
      if (armbar) armbar.hidden = true;
      closePop();
    }
    paintHead();
  }
  function onArmedKey(e) {
    if (!alive()) { document.removeEventListener('keydown', onArmedKey, true); return; }
    if (e.key !== 'Escape') return;
    e.preventDefault(); e.stopPropagation();
    if (popEl) { closePop(); return; }
    setArmed(false);
  }
  function paintArmbar() {
    if (!armbar) return;
    armbar.hidden = false;
    armbar.replaceChildren();
    armbar.appendChild(icon('pin'));
    const t = el('span');
    t.appendChild(el('b', null, 'Pin mode is on.'));
    t.appendChild(document.createTextNode(
      ' Click an artboard to pin a comment to that point. While it is on, the canvas cannot be panned, zoomed or selected — every click lands here instead.'));
    armbar.appendChild(t);
    armbar.appendChild(el('span', 'dc-sp'));
    const off = btn('dc-btn dc-btn-s', 'Done (Esc)');
    off.addEventListener('click', () => setArmed(false));
    armbar.appendChild(off);
  }

  function onOverlayClick(e) {
    if (!armed) return;
    if (popEl) { closePop(); return; }
    const hit = hitTest(e.clientX, e.clientY);
    if (!hit) { flash('That point is not on an artboard — a pin anchors to an artboard, not to empty canvas.', true); return; }
    openComposer(hit, e.clientX, e.clientY);
  }
  function hitTest(cx, cy) {
    let found = null;
    for (const a of geometry()) {
      const b = a.box;
      // Last match wins: later in DOM order paints on top.
      if (cx >= b.left && cx <= b.left + b.width && cy >= b.top && cy <= b.top + b.height) found = a;
    }
    if (!found) return null;
    return {
      a: found,
      fx: (cx - found.box.left) / found.box.width,
      fy: (cy - found.box.top) / found.box.height,
    };
  }

  // Minted in the payload's OWN grammar (CONTRACT §4.2) so these strings hand
  // straight to `claude.comments.customAnchors` when v0.2 injects it, with zero
  // migration. Under an unmodified web-chat the string is syntactically valid
  // CSS that matches nothing, so the shell's own marker layer skips it instead
  // of throwing — and this pane draws the markers.
  function mint(hit, note) {
    const a = hit.a;
    const selector = A.artboardAnchor(a.file, hit.fx, hit.fy);
    // artboardAnchor validates strictly and returns null rather than an invalid
    // string. An invalid anchor is DROPPED, never stored (CONTRACT §4.3).
    if (!selector) return null;
    // The label is derived from OUR index, never from frame DOM text, and goes
    // through capFrame — BOUNDED AND SANITISED, which is what CONTRACT §4.4
    // asks for, not merely bounded. Both halves are load-bearing:
    //   - 60 chars, because lib/server/routes/comments.js:35-41 describeAnchor
    //     interpolates this straight into `anchor_label` as `<mount>: "<text>"`
    //     with only a .trim(), and that string is what get_comments hands me;
    //   - control characters flattened, because `a.file` is only as clean as
    //     the artboard index, and that index is not a closed set. It is built
    //     from readdirSync entry names (service.js artboardIndex) with no name
    //     grammar of the service's own — a POSIX filename may legally contain a
    //     newline — and the service publishes `artboards` in the failure states
    //     too. The store is also writable by anything same-origin, which under
    //     CONTRACT §9.3 includes the canvas frame itself. A .slice(60) alone
    //     would let a newline through into my prompt.
    const where = a.known ? a.file : 'on the canvas';
    const label = capFrame(where + ' · ' + pct(hit.fx) + '%,' + pct(hit.fy) + '%');
    const spec = a.known ? artboardSpec(a.file) : null;
    return {
      text: String(note || ''),
      anchor: {
        mount: mountId,
        selector: selector,
        text: label,
        ordinal: 0,
        // The drift fingerprint rides INSIDE the pin's own anchor object, so it
        // inherits the pin's shared/private filtering instead of leaking pin
        // locations into the store, where get_store would hand them over
        // regardless (CONTRACT §4.5).
        dsn: {
          v: 1,
          file: a.known ? capFrame(a.file) : null,
          fx: Math.round(hit.fx * 10000) / 10000,
          fy: Math.round(hit.fy * 10000) / 10000,
          w: spec ? num(spec.w) : null,
          h: spec ? num(spec.h) : null,
          src: srcFingerprint(a),
          exact: !!a.box.exact,
        },
      },
    };
  }

  function openComposer(hit, cx, cy) {
    const pop = el('div', 'dc-pop');
    const head = el('div', 'dc-pop-h');
    head.appendChild(icon('pin'));
    head.appendChild(el('span', 'a',
      (hit.a.known ? hit.a.file : 'on the canvas') + ' · ' + pct(hit.fx) + '%,' + pct(hit.fy) + '%'));
    pop.appendChild(head);
    const ta = el('textarea', 'dc-ta');
    ta.setAttribute('rows', '3');
    ta.setAttribute('placeholder', 'Comment on this spot…');
    // data-no-persist: a half-typed pin must not ride into graph history, and
    // excluding it also keeps the ask note's form_state key stable.
    ta.setAttribute('data-no-persist', '');
    pop.appendChild(ta);
    const shareRow = el('label', 'dc-lab');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.setAttribute('data-no-persist', '');
    shareRow.appendChild(cb);
    shareRow.appendChild(document.createTextNode('Share with Claude'));
    const row = el('div', 'dc-row');
    row.appendChild(shareRow);
    row.appendChild(el('span', 'dc-sp'));
    const cancel = btn('dc-btn dc-btn-s', 'Cancel');
    cancel.addEventListener('click', () => closePop());
    row.appendChild(cancel);
    const save = btn('dc-btn dc-btn-s dc-btn-go', 'Pin');
    save.addEventListener('click', () => {
      const minted = mint(hit, ta.value.trim());
      closePop();
      if (!minted) { flash('That anchor did not validate, so nothing was stored.', true); return; }
      setArmed(false);
      placePin(minted, cb.checked);
    });
    row.appendChild(save);
    pop.appendChild(row);
    showPop(pop, cx, cy);
    ta.focus();
  }

  async function placePin(minted, shared) {
    try {
      const r = await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: minted.text, shared: !!shared, anchor: minted.anchor }),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
    } catch (e) {
      flash('The pin could not be stored: ' + s(e && e.message), true);
      return;
    }
    flash('Pinned to ' + minted.anchor.text + (shared ? ' — shared with Claude.' : ' — private to you.'));
    pollPins();
  }

  // Read-back is validated too (CONTRACT §4.3): the server stores `anchor`
  // verbatim with zero validation and describeAnchor does not truncate
  // `selector`, so an unbounded or malformed anchor is dropped here rather than
  // projected, shown, or believed.
  function decorate(pin) {
    const a = obj(pin && pin.anchor);
    if (!a || s(a.mount) !== s(mountId)) return null;
    if (!A.isValidAnchor(a.selector)) return null;
    const parsed = A.parseArtboardAnchor(a.selector);
    if (!parsed) return null;
    const fp = obj(a.dsn);
    return {
      id: s(pin.id),
      text: String(pin.text == null ? '' : pin.text).slice(0, 800),
      shared: pin.shared !== false,
      replies: arr(pin.replies).slice(-6).map((r) => ({
        author: s(r && r.author), text: String((r && r.text) || '').slice(0, 400),
      })),
      hash: parsed.fileHash12,
      fx: parsed.fx,
      fy: parsed.fy,
      label: capFrame(a.text),
      fp: fp && num(fp.v) === 1 ? fp : null,
    };
  }
  async function pollPins() {
    if (IS_PREVIEW || !alive()) return;
    let list = null;
    try {
      const r = await fetch('/api/comments?mount=' + encodeURIComponent(mountId));
      if (!r.ok) return;
      const j = await r.json();
      list = arr(j.comments);
    } catch (e) { return; }       // offline or frozen export: keep what we have
    const next = [];
    for (const p of list) { const d = decorate(p); if (d) next.push(d); }
    const changed = next.length !== pins.length ||
      next.some((p, i) => p.id !== pins[i].id || p.shared !== pins[i].shared ||
        p.text !== pins[i].text || p.replies.length !== pins[i].replies.length);
    pins = next;
    if (changed) lastGeomSig = '';
    if (pins.length) schedulePump();
    layoutMarkers();
  }

  const pinTone = (p) => (!p.shared ? 'priv' : (p.replies.some((r) => r.author === 'claude') ? 'rep' : ''));
  // A fraction anchor survives an artboard rewrite and then points confidently
  // at whatever moved into that spot, so a changed fingerprint renders the
  // marker as "may have moved" rather than as healthy (CONTRACT §4.5).
  function drifted(p, a) {
    if (!p.fp || !a) return false;
    const spec = a.known ? artboardSpec(a.file) : null;
    const w = spec ? num(spec.w) : null, h = spec ? num(spec.h) : null;
    const fw = num(p.fp.w), fh = num(p.fp.h);
    if (w != null && fw != null && (w !== fw || h !== fh)) return true;
    const cur = srcFingerprint(a);
    return !!(p.fp.src && cur && p.fp.src !== cur);
  }
  function geoFor(hash) {
    for (const a of geometry()) if (hashOf(a.file) === hash) return a;
    return null;
  }

  function layoutMarkers(g) {
    if (!ov || !frame || loadState !== 'ok') return;
    const geo = g || geometry();
    const byHash = new Map();
    for (const a of geo) byHash.set(hashOf(a.file), a);
    let fr;
    try { fr = frame.getBoundingClientRect(); } catch (e) { return; }
    const seen = new Set();
    const docked = [];
    for (const p of pins) {
      const a = byHash.get(p.hash) || null;
      let x = null, y = null;
      if (a) {
        x = a.box.left + p.fx * a.box.width - fr.left;
        y = a.box.top + p.fy * a.box.height - fr.top;
        if (x < 2 || y < 2 || x > fr.width - 2 || y > fr.height - 2) { x = null; y = null; }
      }
      if (x == null) { docked.push({ p: p, why: a ? 'off-screen' : 'absent' }); continue; }
      seen.add(p.id);
      let m = markerEls.get(p.id);
      if (!m) {
        m = btn('dc-mk', '');
        m.setAttribute('aria-label', 'Pin: ' + (p.label || p.id));
        m.appendChild(icon('pin'));
        m.addEventListener('click', (e) => {
          e.stopPropagation();
          openPinPop(p, e.clientX, e.clientY, geoFor(p.hash), null);
        });
        ov.appendChild(m);
        markerEls.set(p.id, m);
      }
      const dr = drifted(p, a);
      m.className = 'dc-mk' + (pinTone(p) ? ' ' + pinTone(p) : '') + (dr ? ' drift' : '');
      m.title = (p.shared ? '' : '(private) ') + (p.text || p.label || 'pin') +
        (dr ? '  —  may have moved: this artboard changed since the pin was placed.' : '');
      m.style.left = x + 'px';
      m.style.top = y + 'px';
    }
    for (const entry of Array.from(markerEls)) {
      if (!seen.has(entry[0])) { entry[1].remove(); markerEls.delete(entry[0]); }
    }
    paintDock(docked);
  }

  // A pin whose artboard is not in view is DOCKED, never dropped (CONTRACT §5.2).
  function paintDock(docked) {
    if (!dockNode) return;
    const sig = docked.map((d) => d.p.id + d.why + (d.p.shared ? 's' : 'p')).join('|');
    if (dockNode._sig === sig) return;
    dockNode._sig = sig;
    dockNode.replaceChildren();
    if (!docked.length) return;
    const h = el('div', 'dc-dock-h', docked.length + ' pin' + (docked.length === 1 ? '' : 's') + ' off screen');
    h.title = 'These pins sit on artboards that are not in view. This build cannot recentre the canvas for you — pan or zoom to them yourself.';
    dockNode.appendChild(h);
    for (const d of docked.slice(0, 8)) {
      const b = btn('dc-dk', '');
      b.appendChild(el('span', 'dc-dot' + (pinTone(d.p) ? ' ' + pinTone(d.p) : '')));
      b.appendChild(el('span', 't', d.p.label || d.p.text || 'pin'));
      b.title = (d.why === 'absent'
        ? 'That artboard is not on this canvas any more.'
        : 'That artboard is off screen.') + ' Clicking cannot recentre the canvas in this build.';
      b.addEventListener('click', (e) => { e.stopPropagation(); openPinPop(d.p, e.clientX, e.clientY, null, d.why); });
      dockNode.appendChild(b);
    }
    if (docked.length > 8) dockNode.appendChild(el('div', 'dc-dock-h', '+' + (docked.length - 8) + ' more'));
  }

  function openPinPop(p, cx, cy, a, why) {
    const pop = el('div', 'dc-pop');
    const head = el('div', 'dc-pop-h');
    head.appendChild(icon('pin'));
    head.appendChild(el('span', 'a', p.label || 'pin'));
    head.appendChild(el('span', 'dc-sp'));
    head.appendChild(el('span', null, p.shared ? 'shared' : 'private'));
    pop.appendChild(head);
    pop.appendChild(el('div', 'dc-pop-t', p.text || '(no text)'));
    for (const r of p.replies) {
      const rr = el('div', 'dc-pop-r');
      rr.appendChild(el('i', null, r.author === 'claude' ? 'Claude' : 'you'));
      rr.appendChild(document.createTextNode(r.text));
      pop.appendChild(rr);
    }
    // No reveal() in this build (CONTRACT §4.6): say so rather than dead-click.
    if (why === 'absent') pop.appendChild(el('div', 'dc-fine',
      'Its artboard is not on this canvas any more, so there is nowhere to point: reseed if the file is back, otherwise this pin has outlived what it was about.'));
    else if (why === 'off-screen') pop.appendChild(el('div', 'dc-fine',
      'Its artboard is off screen, and this build cannot recentre the canvas — pan or zoom to it yourself.'));
    if (drifted(p, a)) pop.appendChild(el('div', 'dc-fine',
      'May have moved: this artboard changed since the pin was placed, so the point under the marker may not be what was meant.'));

    const ta = el('textarea', 'dc-ta');
    ta.setAttribute('rows', '2');
    ta.setAttribute('placeholder', 'Reply…');
    ta.setAttribute('data-no-persist', '');
    pop.appendChild(ta);
    const row = el('div', 'dc-row');
    const del = btn('dc-btn dc-btn-s', 'Remove');
    del.addEventListener('click', async () => {
      closePop();
      try {
        const r = await fetch('/api/comments/' + encodeURIComponent(p.id), { method: 'DELETE' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flash('Pin removed.');
      } catch (e) { flash('Could not remove that pin: ' + s(e && e.message), true); }
      pollPins();
    });
    row.appendChild(del);
    row.appendChild(el('span', 'dc-sp'));
    const send = btn('dc-btn dc-btn-s dc-btn-go', 'Reply');
    send.addEventListener('click', async () => {
      const text = ta.value.trim();
      if (!text) return;
      closePop();
      try {
        const r = await fetch('/api/comments/' + encodeURIComponent(p.id) + '/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, author: 'user' }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flash('Replied on ' + p.id + '.');
      } catch (e) { flash('Could not reply: ' + s(e && e.message), true); }
      pollPins();
    });
    row.appendChild(send);
    pop.appendChild(row);
    showPop(pop, cx, cy);
  }

  function showPop(pop, cx, cy) {
    closePop();
    if (!wrapNode) return;
    popEl = pop;
    wrapNode.appendChild(pop);
    let wr;
    try { wr = wrapNode.getBoundingClientRect(); } catch (e) { wr = { left: 0, top: 0, width: 320, height: 320 }; }
    const w = pop.offsetWidth || 268, h = pop.offsetHeight || 170;
    pop.style.left = Math.max(6, Math.min((cx - wr.left) + 8, wr.width - w - 6)) + 'px';
    pop.style.top = Math.max(6, Math.min((cy - wr.top) + 8, wr.height - h - 6)) + 'px';
    document.addEventListener('pointerdown', onOutsidePop, true);
  }
  function closePop() {
    if (!popEl) return;
    popEl.remove();
    popEl = null;
    document.removeEventListener('pointerdown', onOutsidePop, true);
  }
  function onOutsidePop(e) {
    if (!popEl) { document.removeEventListener('pointerdown', onOutsidePop, true); return; }
    const path = e.composedPath ? e.composedPath() : [];
    if (path.indexOf(popEl) >= 0) return;
    closePop();
  }

  // Re-project on every geometry change: pan, zoom, focus mode, a pane resize, a
  // window resize. The pump measures at most every 60 ms and only while there is
  // something to keep in place.
  function pump() {
    rafId = 0;
    if (!alive()) return stopAll();
    if (loadState !== 'ok' || (!pins.length && !armed)) return;
    const now = Date.now();
    if (now - lastMeasure >= 60) {
      lastMeasure = now;
      const g = geometry();
      const sig = geomSig(g);
      if (sig !== lastGeomSig) { lastGeomSig = sig; layoutMarkers(g); }
    }
    schedulePump();
  }
  function schedulePump() {
    if (rafId || !alive()) return;
    try { rafId = requestAnimationFrame(pump); } catch (e) { rafId = 0; }
  }
  function onResize() {
    if (!alive()) { window.removeEventListener('resize', onResize); return; }
    lastGeomSig = '';
    schedulePump();
  }

  // ═════════════════════════════════════════════════════════════════════════
  // DELIVERY (CONTRACT §7)
  // ═════════════════════════════════════════════════════════════════════════
  // Split for two reasons, both real. A literal script tag would end this script
  // early, because the shell parses pane html with the HTML parser. And the
  // fully quoted form of that id attribute is one of the upstream markers
  // scripts/check-no-vendored.mjs fails a tracked file for — so this pane
  // recognises the payload without ever writing that literal down (CONTRACT §9.1).
  const DOC_MARK = '<' + 'script type="application/json" id="appifact-doc';
  function docBlock(src) {
    const i = src.indexOf(DOC_MARK);
    if (i < 0) return null;
    const gt = src.indexOf('>', i);
    if (gt < 0) return null;
    const end = src.indexOf('<' + '/script>', gt);
    return src.slice(gt + 1, end < 0 ? Math.min(src.length, gt + 8193) : end);
  }
  // CONTRACT §5.4 / FINDINGS §4: a page whose state block still carries
  // store:"db" boots read-only against a live store no matter what a host
  // provides — it is a claude.ai/design canvas, not ours. Seeding DELETES
  // state.store, so a seeded canvas never has it. Top-level keys come first in
  // the serialised block, and a `"store":"db"` occurring inside a nested JSON
  // string would be backslash-escaped, which is what the leading guard excludes.
  // The whole block is scanned, not a prefix: key order is the payload's choice,
  // not ours, and a linear pass over even a 2 MB block costs a millisecond.
  function looksLiveStore(block) {
    return /(^|[^\\])"store"\s*:\s*"db"/.test(block);
  }

  async function ensureLoad() {
    if (IS_PREVIEW || !SECURE) return;
    const c = canvas;
    if (!c || c.ok === false || s(c.state) !== 'ready') return;
    const name = s(c.payload_component);
    if (!name) { loadState = 'noname'; repaint(); return; }
    // CONTRACT §9.2, enforced where the bytes are CHOSEN rather than assumed.
    //
    // Whatever comes back from GET /api/components/<name> is mounted as an
    // UNSANDBOXED, SAME-ORIGIN srcdoc — the realm §9.3 describes, which reads
    // private pins with their text (GET /api/comments without shared_only),
    // forges pins into my context (the `comment` branch of policy.classify has
    // no source gate and routing:'none' does not suppress it) and can POST
    // /api/packs/install. §9.2 is the invariant that makes that survivable, so
    // this pane must only ever mount the carrier its OWN service wrote.
    //
    // `payload_component` does not carry that guarantee on its own. It is an
    // ordinary store value, and the store is writable by anything that can
    // reach POST /api/store — Claude, a local driver process, another pane, and
    // (same-origin) the canvas frame itself. Unchecked, one store write points
    // this pane at any component in the registry and gets its source executed
    // in the daemon's trust realm. The name grammar is the containment rule,
    // exactly as it is for the components route itself (routes/components.js
    // `resolvable`, which is why traversal is not also a concern here).
    //
    // !! KEEP IN SYNC with service.js CARRIER_RE / carrierNameFor() !!
    // `design-canvas-payload` is the CONTRACT §2.1 base; the 8-hex suffix is
    // the mount hash the service appends so two panes on one node cannot
    // clobber each other's payload.
    if (!/^design-canvas-payload(-[0-9a-f]{8})?$/.test(name)) {
      loadedKey = null;
      loadState = 'badname';
      loadErr = capFrame(name);   // never let an unbounded store value sit in loadErr
      repaint();
      return;
    }
    // Keyed on the SEED, not on dsn_canvas.seq — seq is bumped on every write,
    // and re-fetching 2.4 MB (and resetting the user's pan and zoom) because a
    // file's mtime changed would be its own bug.
    const key = name + '@' + s(c.seeded_at);
    if (key === loadedKey) return;          // set before the first await: re-entry guard
    loadedKey = key;
    loadState = 'loading'; loadErr = ''; booted = null;
    repaint();
    let src = '';
    try {
      const r = await fetch('/api/components/' + encodeURIComponent(name), { headers: { accept: 'application/json' } });
      if (!r.ok) { loadState = 'http'; loadErr = 'HTTP ' + r.status; repaint(); return; }
      const j = await r.json();
      src = typeof j.source === 'string' ? j.source : '';
    } catch (e) {
      loadState = 'net'; loadErr = s(e && e.message); repaint(); return;
    }
    if (!alive()) return;
    if (!src) { loadState = 'empty'; repaint(); return; }
    const block = docBlock(src);
    if (block === null) { src = ''; loadState = 'not-canvas'; repaint(); return; }
    if (looksLiveStore(block)) { src = ''; loadState = 'live-store'; repaint(); return; }

    loadState = 'ok';
    paintStage();               // attaches the wrap before the frame goes into it
    mountFrame(src);
    src = '';                   // drop our reference: the frame owns those bytes now
    srcHashes.clear();
    lastGeomSig = '';
    paintHead();
    probeCanvas();
    if (!pollTimer) {
      pollTimer = setInterval(() => {
        if (!alive()) return stopAll();
        if (document.visibilityState === 'hidden') return;
        pollPins();
      }, 4000);
    }
    pollPins();
  }

  // ═════════════════════════════════════════════════════════════════════════
  // EDIT MODE — carrying the Save across (CONTRACT §6.6, §9.5)
  // ═════════════════════════════════════════════════════════════════════════
  //
  //   editor Save → claude.self.publish(completeDocument)        [in the frame]
  //     → the shim parses out the state block, 0.79% of the bytes
  //     → parent.postMessage to THIS pane                        [frame → pane]
  //     → the pane checks the sender, wraps the block in a minimal page and
  //       POSTs it to the service's loopback listener            [pane → service]
  //     → the service runs the helper's own --extract and writes the user's
  //       own .dc.html files: extract first, back up, write-then-rename (§6.4)
  //     → the pane acks; the shim's promise resolves, or rejects with a plain
  //       Error and the editor keeps the user's changes
  //
  // The frame never learns the endpoint, and the block never goes near the
  // store: POST /api/store puts a whole patch into the event ring, the WS frame
  // and every SSE subscriber, and graph.js snapshots the store into every
  // committed node — a canvas with images would be copied there forever (§6.6).
  const SAVE_TIMEOUT_MS = 150000;   // inside the shim's own 180 s, so the pane answers first
  const SAVE_LABEL = { saving: ['saving…', 'work'], saved: ['saved', 'ok'], failed: ['save failed', 'bad'] };

  function paintSaveBadge() {
    const pair = SAVE_LABEL[saveState.phase];
    els.save.hidden = !pair;
    if (!pair) return;
    els.save.textContent = pair[0];
    els.save.className = 'dc-badge ' + pair[1];
    els.save.title = saveState.phase === 'failed'
      ? 'The last Save did not write. Your changes are still in the editor — press Save again.'
      : (saveState.phase === 'saving'
        ? 'Writing the edited artboards back to your working files.'
        : 'Written to your working files ' + (relTime(saveState.at) || 'just now') + '.');
  }

  // Where the service says to POST. From the adopted dsn_canvas first and the
  // live store second — the seq guard refuses a repeat, so an endpoint
  // republished without a bump would otherwise be invisible here.
  function saveEndpoint() {
    let e = obj(canvas && canvas.save_endpoint);
    if (!e) {
      try { const raw = obj(store.get('dsn_canvas')); e = raw ? obj(raw.save_endpoint) : null; }
      catch (err) { e = null; }
    }
    const url = e ? s(e.url) : '';
    if (!url) return null;
    let u = null;
    try { u = new URL(url, ORIGIN || undefined); } catch (err) { return null; }
    // LOOPBACK ONLY, and this is not decoration. `dsn_canvas` is an ordinary
    // store value, and the store is writable by anything that can reach POST
    // /api/store — Claude, a local driver, another pane, and (same-origin) the
    // canvas frame itself. Unchecked, one forged write would point this pane at
    // an arbitrary host and hand it the user's whole design. The service's
    // listener is bound to 127.0.0.1 (§6.6), so anything else is a forgery.
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
    const h = u.hostname.toLowerCase();
    if (h !== '127.0.0.1' && h !== 'localhost' && h !== '::1' && h !== '[::1]') return null;
    return { url: u.href, token: s(e.token) };
  }
  // The token is a per-spawn random PATH token. A url that already carries it is
  // used as it stands; otherwise it is appended, so both shapes work.
  function saveUrl(ep) {
    if (!ep.token || ep.url.indexOf(ep.token) >= 0) return ep.url;
    return ep.url.replace(/\/+$/, '') + '/' + encodeURIComponent(ep.token);
  }

  // The minimal page the block travels in: ~21 KB against the 2.4 MB document,
  // and --extract reads it happily (verified — exit 0, empty stderr, all four
  // files recovered). Static on both sides; only the body comes from the frame.
  const MINI_HEAD = '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<title>wc-design save handover</title>\n</head>\n<body>\n';
  const MINI_TAIL = '\n</body>\n</html>\n';
  const nameList = (v) => arr(v).slice(0, 12).map(capFrame).filter(Boolean);

  // POST the handover. Deliberately a CORS *simple* request: POST, a string
  // body (fetch stamps text/plain;charset=UTF-8 on it) and NOT ONE custom
  // header. Adding a header — content-type: application/json, a token header,
  // anything — makes the browser send a preflight OPTIONS first, and the
  // listener answers POST only (§6.6), so the save would die before the body
  // was sent. The body is JSON text; `doc` is the complete minimal page, which
  // is what --extract consumes and what writeBack({ docHtml }) takes.
  // !! Wire format, keep in sync with service.js !!
  //   { token, mount, seq, at, doc, doc_bytes, block_bytes, full_bytes }
  //   ← { ok, written[], unchanged[], orphaned[], backup_dir, error, hint }
  async function postSave(ep, body) {
    const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; try { ctl && ctl.abort(); } catch (e) {} }, SAVE_TIMEOUT_MS);
    try {
      const r = await fetch(saveUrl(ep), {
        method: 'POST', body: JSON.stringify(body),
        cache: 'no-store', credentials: 'omit', mode: 'cors',
        signal: ctl ? ctl.signal : undefined,
      });
      let j = null, text = '';
      try { text = await r.text(); } catch (e) { text = ''; }
      if (text) { try { j = obj(JSON.parse(text)); } catch (e) { j = null; } }
      const err = j ? s(j.error) : '', hint = j ? s(j.hint || j.stderr) : '';
      const backup = j ? s(j.backup_dir || j.backupDir) : '';
      if (!r.ok) return { ok: false, backup: backup, hint: hint || capFrame(text),
        error: err || ('the save listener answered HTTP ' + r.status) };
      if (j && j.ok === false) return { ok: false, backup: backup, hint: hint,
        error: err || 'the service refused the save' };
      return { ok: true, backup: backup, written: nameList(j && j.written),
        unchanged: nameList(j && j.unchanged), orphaned: nameList(j && j.orphaned) };
    } catch (e) {
      if (timedOut) return { ok: false, error: 'the save timed out after ' + Math.round(SAVE_TIMEOUT_MS / 1000) + 's' };
      // A CORS refusal and a dead listener are the same TypeError to a page, so
      // name both rather than guessing at one.
      return { ok: false, error: 'could not reach the save listener',
        hint: s(e && e.message) + ' — the service may have stopped (one runs only while its pane is on '
          + 'the active node with a browser watching), or its listener refused this origin.' };
    } finally { clearTimeout(timer); }
  }

  // frame → pane. THE source check is identity on the window object (§6.6): a
  // message is honoured only when it came from the exact iframe this pane
  // mounted, so a nested frame inside the canvas, another pane, or the surface
  // page itself cannot drive a write to the user's files. Never throws: a
  // rejection here would leave the editor waiting on a promise nobody settles.
  async function onFrameMessage(e) {
    if (!alive()) { window.removeEventListener('message', onFrameMessage); return; }
    const d = e && e.data;
    if (!d || typeof d !== 'object' || d.wcdc !== 'save') return;
    if (ISOLATE) return;                                   // no host object was installed there
    if (!frame || !e.source || e.source !== frame.contentWindow) return;

    const n = num(d.n) || 0;
    const block = typeof d.block === 'string' ? d.block : '';
    // The ack settles the shim's promise; `ok:false` becomes a plain Error over
    // there — see the error-discipline note in the shim, which is the one thing
    // in this path that can brick a tab. The ack carries no secret (never the
    // endpoint, never the token), so '*' is right.
    const ack = (ok, error) => {
      try { e.source.postMessage({ wcdc: 'save-ack', n: n, ok: !!ok, error: s(error) }, '*'); }
      catch (err) { /* the frame went away mid-save; the write still happened */ }
    };
    const fail = (error, hint, backup) => {
      saveState = { phase: 'failed', at: Date.now(), written: [], unchanged: [], orphaned: [],
                    backup: s(backup), error: s(error), hint: s(hint) };
      ack(false, error);
      flash('Save failed: ' + s(error), true);
      paintHead();
    };

    try {
      if (block.length < 64) return fail('the editor handed over an empty state block', '');
      const ep = saveEndpoint();
      if (!ep) return fail('this pane has no save endpoint to write to',
        'The service publishes it as dsn_canvas.save_endpoint. Reseed, or ask Claude to check that the '
        + 'design-canvas service is running and approved (' + TRUST + '). Your edits are still in the editor.');

      saveState = { phase: 'saving', at: Date.now(), written: [], unchanged: [], orphaned: [],
                    backup: '', error: '', hint: '' };
      flash('Saving ' + (fmtBytes(block.length) || 'the canvas') + ' back to your files…');
      paintHead();

      const res = await postSave(ep, {
        token: ep.token, mount: s(mountId), seq: n, at: Date.now(),
        doc: MINI_HEAD + block + MINI_TAIL,
        doc_bytes: MINI_HEAD.length + block.length + MINI_TAIL.length,
        block_bytes: block.length, full_bytes: num(d.full) || 0,
      });
      if (!res.ok) return fail(res.error, res.hint, res.backup);
      // Ack before anything else: the editor is holding a promise, and it must
      // be settled even if this pane was replaced while the write was in flight.
      ack(true, '');
      if (!alive()) return;                      // the pane went away; the write still landed

      saveState = { phase: 'saved', at: Date.now(), written: arr(res.written),
                    unchanged: arr(res.unchanged), orphaned: arr(res.orphaned),
                    backup: s(res.backup), error: '', hint: '' };
      const w = saveState.written.length;
      flash(w ? ('Saved · ' + w + ' file' + (w === 1 ? '' : 's') + ' written') : 'Saved · nothing had changed');
      paintHead();
    } catch (err) {
      console.error('design-canvas save', err);
      fail('the pane failed while saving', s(err && err.message));
    }
  }

  // ── the two banners edit mode owns ──────────────────────────────────────
  function editBanner() {
    if (IS_PREVIEW || ISOLATE || loadState !== 'ok' || hostSpliced === null) return null;
    if (hostSpliced === false) {
      return bn('warn', 'warn', ['Editing is off for this canvas: the carrier the service wrote has no ',
        ['code', null, '<head>'], ' to install the host object into, so the editor booted read-only. ',
        'It still pans, zooms and exports. Reseed to try again.']);
    }
    if (!saveEndpoint()) {
      return bn('warn', 'warn', ['Editing is on, but ', ['b', null, 'saving is not wired up'],
        ': the service has published no ', ['code', null, 'dsn_canvas.save_endpoint'],
        '. Anything you change stays in this browser. Reseed, or ask Claude to check the service.']);
    }
    if (saveState.phase !== 'idle') return null;          // the result banner has the floor
    const dir = s(files && files.dir);
    return bn('', 'save', ['Editing is on: the editor’s ', ['b', null, 'Save'], ' writes these artboards back to ',
      dir ? ['code', null, dir] : 'your working folder', ' through the helper’s own ',
      ['code', null, '--extract'], ' — every file it replaces is backed up first, and nothing is deleted.']);
  }

  function saveResultBanner() {
    const st = saveState, w = st.written.length;
    if (st.phase !== 'saved' && st.phase !== 'failed') return null;
    const okc = st.phase === 'saved';
    const b = el('div', 'dc-bn ' + (okc ? 'ok' : 'bad'));
    b.appendChild(icon(okc ? 'save' : 'warn'));
    const t = el('div');
    if (okc) {
      t.appendChild(el('b', null, w ? 'Saved · ' + w + ' file' + (w === 1 ? '' : 's') + ' written to disk.'
                                   : 'Saved · your files already said this.'));
      if (w) t.appendChild(el('div', 'dc-mono', st.written.join(', ')));
      if (st.unchanged.length) t.appendChild(el('div', 'dc-fine', 'Unchanged: ' + st.unchanged.join(', ')));
      if (st.orphaned.length) t.appendChild(line(el('div', 'dc-fine'), ['Gone from the saved canvas and ',
        ['b', null, 'left alone'], ' on disk: ', st.orphaned.join(', '), '. Delete them yourself if that was deliberate.']));
    } else {
      t.appendChild(el('b', null, 'Save failed — ' + st.error + '.'));
      t.appendChild(el('div', null, 'Your working files are as they were and your changes are still in '
        + 'the editor. Press Save again once the cause is fixed.'));
      if (st.hint) t.appendChild(el('div', 'dc-mono', st.hint.slice(0, 800)));
    }
    if (st.backup) t.appendChild(el('div', 'dc-fine',
      (okc ? 'The versions you had before this save: ' : 'A backup of the files as they were: ') + st.backup));
    b.appendChild(t);
    return b;
  }

  // ═════════════════════════════════════════════════════════════════════════
  // WIRING
  // ═════════════════════════════════════════════════════════════════════════
  function readStore() {
    let c = null, f = null;
    try { c = store.get('dsn_canvas'); } catch (e) {}
    try { f = store.get('dsn_files'); } catch (e) {}
    if (obj(c) && accept('dsn_canvas', c)) canvas = c;
    if (obj(f) && accept('dsn_files', f)) files = f;
  }
  function onCanvas(v) {
    if (!alive() || !obj(v) || !accept('dsn_canvas', v)) return;
    const prev = canvas;
    canvas = v;
    if (!prev || prev.seeded_at !== v.seeded_at || prev.payload_component !== v.payload_component) {
      srcHashes.clear();
      // A Save writes to `dir`, which the service watches, so it suppresses its
      // own writes and then re-seeds ONCE deliberately (CONTRACT §6.7). That
      // re-seed reloads the frame — say why, or the canvas appears to blink and
      // lose the user's pan and zoom for no reason they can see.
      if (prev && saveState.phase === 'saved' && Date.now() - saveState.at < 60000) {
        flash('Reloaded the canvas from the files you just saved.');
      }
    }
    // Leaving `ready` tears the frame down, so the load must be re-armed or
    // coming back to the same seed would leave an empty wrap on screen.
    if (s(v.state) !== 'ready' || v.ok === false) { loadedKey = null; loadState = 'idle'; }
    run();
  }
  function onFiles(v) {
    if (!alive() || !obj(v) || !accept('dsn_files', v)) return;
    files = v;
    paintHead();
  }

  // Everything async lives inside this call. Top-level `await` here would be a
  // SyntaxError under `new Function` and the whole pane would never run — the
  // failure mode that shows up as a pane that renders its markup and nothing
  // else (CONTRACT §5.1).
  function repaint() { paintHead(); paintStage(); }
  function run() {
    repaint();
    (async () => {
      try { await ensureLoad(); } catch (e) { console.error('design-canvas load', e); }
    })();
  }

  readStore();
  try {
    store.subscribe('dsn_canvas', onCanvas);
    store.subscribe('dsn_files', onFiles);
  } catch (e) { console.error('design-canvas subscribe', e); }
  window.addEventListener('resize', onResize);
  // The frame → pane leg of Save (CONTRACT §6.6). onFrameMessage swallows its
  // own failures into an ack, so this listener can never reject into nothing —
  // an unsettled promise here would leave the editor waiting forever.
  window.addEventListener('message', onFrameMessage);
  setTimeout(() => { if (alive() && !canvas) { escalated = true; repaint(); } }, 6000);
  run();
</script>
