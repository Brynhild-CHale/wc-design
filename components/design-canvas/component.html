<!-- design-canvas — the pane.
     A live Claude Design canvas, seeded on disk by this component's service and
     delivered to the browser through GET /api/components/<payload_component>
     (CONTRACT §7). This file renders the chrome, the frame, the pin overlay and
     one screen per state; it never carries canvas bytes itself. It also installs
     the ONE host member that turns the canvas from a viewer into an editor, and
     carries the editor's Save back to the service (CONTRACT §6.6, §9.5) — see
     "the host object" and "EDIT MODE" below.

     BYTE BUDGET: **at most 144 KB**, well inside the hard 256 KB tripwire
     ceiling (CONTRACT §8.4). It is ~138 KB today — ~19 KB of
     style and markup, 13 KB that is the verbatim inline of
     `scratch/anchor-lib.js` (a component installs exactly four files, so the
     pane cannot import it — CONTRACT §1.2/§5.1), and the rest this script.

     That budget used to read 128 KB, exactly half the ceiling, and edit mode
     (the host object, the save transport, the save-state chrome — CONTRACT
     §6.6/§9.5) does not fit inside it. That is measured, not assumed: the
     feature is 21.9 KB, of which 6.7 KB is comment, so deleting every word of
     explanation in it would still land at ~131 KB. The number moved
     deliberately; the rule behind it did not, and the rule is what matters —
     the 2.4 MB canvas is NOT in this file and must never be. Pane `html` is
     snapshotted into every committed graph node, so a payload here would be
     copied into every node on disk, forever (FINDINGS §8). It arrives at
     runtime, over fetch, and goes straight into an iframe's `srcdoc`.
     (The table in FINDINGS §12 still describes this file as held under 128 KB;
     that line belongs to that document's owner, not to this one.)

     Two failure modes kill a pane silently; both are avoided here:
       - the script body is compiled as `new Function('store','root','params','mountId', body)`
         (`public/mount-runtime.js:95-105`), so top-level `await` is a SyntaxError
         and the pane never runs. Every `await` here sits inside an async
         function — the IIFE in run(), or an async event handler.
       - `document.querySelector` cannot see into the shadow root. Every query
         goes through `root`. `document.createElement` is fine and is used
         throughout in preference to innerHTML, because much of what is rendered
         here came out of a canvas the pane does not trust (CONTRACT §9.3).
-->
<style>

  .dc-flist .v { color: var(--wc-muted, #77777f); font-variant-numeric: tabular-nums; text-align: right; }

  /* file · size · where the size came from — the framing table (CONTRACT §2.1

  /* ── stage ───────────────────────────────────────────────────────────── */
  .dc-stage { padding: 10px 13px 0; min-width: 0; }
  /* resize:vertical is the whole height story — a canvas is never the right
     height by default, and there is no `height` param in CONTRACT §1.1.

     ── SCROLL CONTAINMENT ────────────────────────────────────────────────
     A wheel inside the canvas that finds nothing scrollable does not stop: it
     CHAINS OUT of the frame and scrolls the surface page, carrying the pane off
     screen. It is the loudest symptom of an artboard left at the editor's silent
     800×600 default, because the seeded artboard document is pinned by
     `html,body{height:100%}` and has no scroller of its own to absorb the wheel.

     `overscroll-behavior: contain` on THIS box is what stops it, and — of the
     four mechanisms tried — it is the only one that does. Measured with real
     compositor gestures (CDP Input.synthesizeScrollGesture, not a scripted
     scrollBy, which fires no wheel at all) against a faithful nest: shadow-root
     pane → same-origin canvas frame → opaque-sandboxed artboard frame with no
     scroll container in it. Three runs, identical every time — page scroll after
     three wheel ticks over the artboard:

       baseline                          200px   ← the bug
       contain on this wrap                0px   ← the fix
       a 1px scroll port, no contain     100px   absorbs one tick, then chains
       wheel listener in the parent doc  200px   AND IT NEVER FIRED

     That last row is the one worth writing down: a wheel inside a child frame is
     not observable from the parent document at all, so `preventDefault()` is not
     on the table here, however the listener is bound. In all four the canvas kept
     its own wheel zoom (its handler ran 18–24× over the canvas background) and
     the page still scrolled normally with the pointer outside the pane, so this
     contains the wheel without trapping it. The trade is the usual one for an
     embedded editor: while the pointer is over the canvas, the wheel is the
     canvas's.

     `overflow: auto` + `.dc-sink` give the declaration a real scroll port to bind
     to. That is not what does the work in this engine — contain alone sufficed —
     but a container with NO scrollable overflow is skipped by some scroll chains,
     and one hidden 1px box is a cheap way not to depend on which. buildWrap()
     snaps the 1px straight back, so it costs no visible shift. */
  .dc-wrap { position: relative; width: 100%; height: 62vh; min-height: 300px;
             resize: vertical; overflow: auto; overscroll-behavior: contain;
             scrollbar-width: none;
             border: 1px solid var(--wc-border, #e2e2e6); border-radius: var(--wc-radius, 8px);
             background: var(--wc-bg, #fff); }
  .dc-wrap::-webkit-scrollbar { width: 0; height: 0; }
  .dc-sink { position: absolute; top: 0; left: 0; width: 1px; height: calc(100% + 1px);
             visibility: hidden; pointer-events: none; }
  .dc-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
                    display: block; background: var(--wc-bg, #fff); }

  .dc-ov.armed { pointer-events: auto; cursor: crosshair;

  /* ── state screens ───────────────────────────────────────────────────── */

<div class="dc">

<script>
  /* Injected globals: store, root, params, mountId. This pane lives in a shadow
     root — never document.querySelector / getElementById.

     Compiled as `new Function('store','root','params','mountId', body)`, so
     nothing below may use top-level `await`, `import` or `export`. */

  /* The anchor library, copied VERBATIM from `scratch/anchor-lib.js`.

     A component installs exactly four files (CONTRACT §1.2, §9.4) and a pane
     script has no module system (CONTRACT §5.1), so the library cannot be
     imported and this is a copy. That file is the source of truth: edit it
     there, re-run `node --test test/uc-port.test.mjs` — which proves the port
     byte-identical to the payload's own `Uc`/`ZP`/`QP` and compiles the file
     exactly the way this pane is compiled — then re-inline it here. The two
     marker lines below delimit the copy; how to extract and diff it is written
     at the end marker. */
  /* @@ANCHOR-LIB-BEGIN@@ */
// ---------------------------------------------------------------------------
// anchor-lib — the anchor grammar of Claude Design's canvas editor, ported.
//
// SOURCE OF TRUTH. THIS FILE IS INLINED, NOT IMPORTED.
//
// A web-chat component installs exactly four files (CONTRACT §1.2, §9.4), so
// `component.html` cannot `import` a helper from this repo. The pane script is
// compiled as `new Function('store','root','params','mountId', body)`
// (CONTRACT §5.1), which has no module system at all. So this file is the
// authoritative copy and its body is COPIED verbatim into the pane script.
// Edit it here, re-run `node --test test/uc-port.test.mjs`, then re-inline.
//
// Constraints this file is written to satisfy, so the copy is mechanical:
//   - no `import` / `export` / top-level `await` — it must compile as the body
//     of a `new Function(...)`, where any of those is a SyntaxError that fails
//     near-silently (CONTRACT §5.1).
//   - exactly one identifier leaks into the pane scope: `DsnAnchor`.
//   - no `document.*` — nothing here touches the DOM.
//   - the trailing `module.exports` line is guarded and is inert in a pane
//     (`typeof module` is 'undefined' there); it exists only so Node tooling
//     can require this file directly.
//
// PROVENANCE. Every constant and every function below is a port of a named
// symbol in Claude Design's `payload.template.html`, read from the user's own
// local install. No upstream bytes are reproduced here beyond the short
// expressions the port necessarily restates (CONTRACT §9.1). The port is
// proven byte-identical to the payload's own implementation by
// `test/uc-port.test.mjs`, which extracts the payload's version at test time
// from the LOCAL install and never from a committed copy (CONTRACT §8.2).
// If that test fails, this file is wrong — not the test.
//
// Upstream symbol map (minified names as of Claude Code 2.1.263 /
// payload sha256 76a2b0a4…; the names are minifier output and WILL churn, so
// the test locates them by shape, never by name):
//
//   Uc   → fileHash12          cyrb53, low 12 hex digits of the 53-bit value
//   ZP   → fraction4           round(clamp01(v) * 9999), zero-padded to 4
//   JP   → fractionFrom4       Number(s) / 9999
//   QP   → anchorSegment       (kind, payload) => "dc"+kind+payload+":nth-of-type(1)"
//   dE   → artboardAnchor      the mint site, artboard branch
//   fE   → parseArtboardAnchor the parse site, artboard branch
//   Die  → FINAL_SEGMENT_RE
//   _ie  → PLAIN_SEGMENT_RE
//   Aie  → ID_SEGMENT_RE
//   Pie  → NTH_OF_TYPE (1)
//   ZCe  → FILE_HASH_HEX (12)
//   Oie  → MAX_ANCHOR_SEGMENTS (10)
//
// WHAT THIS FILE IS NOT. It does not sanitise `anchor.text`. CONTRACT §4.4
// caps the label at 60 characters and forbids deriving it from frame DOM text;
// that is the pane's job at the call site, because the label is untrusted input
// from inside the same-origin frame (CONTRACT §9.3) and this module never sees
// the frame.
// ---------------------------------------------------------------------------

const DsnAnchor = (function () {
  // --- constants, all mirrored from the payload -----------------------------

  // ZCe — how many hex digits of the 53-bit hash survive into an anchor.
  const FILE_HASH_HEX = 12;

  // ZP — a fraction is stored as an integer 0…9999, zero-padded to 4 digits.
  const FRACTION_SCALE = 9999;
  const FRACTION_DIGITS = 4;

  // Pie — the payload mints every synthetic segment with this index and its
  // parser REFUSES any other value, so it is a constant and not a parameter.
  const NTH_OF_TYPE = 1;

  // The four anchor kinds the payload's grammar admits. v0.1.0 mints only 'a'.
  const KIND_ELEMENT = 'e';
  const KIND_ARTBOARD = 'a';
  const KIND_NOTE = 'n';
  const KIND_CANVAS_POINT = 'c';

  // CONTRACT §4.3 / payload dE + fE. The web-chat server stores `anchor`
  // verbatim with zero validation, so this is the only gate there is.

  const HASH_AND_FRACTIONS_RE = /^([0-9a-f]{12})([0-9]{4})([0-9]{4})$/;

  // --- fileHash12 (payload `Uc`) --------------------------------------------
  //
  // cyrb53 with seed 0, truncated. The payload hashes the artboard's FILE PATH
  // with this and splices the 12 hex digits into the anchor.
  //
  // Every step is byte-load-bearing and none of it may be "cleaned up":
  //  - the two seeds are 0xdeadbeef and 0x41c6ce57, written the way the
  //    payload writes them (0xdeadbeef as a signed 32-bit int);
  //  - `Math.imul` is what makes the multiplies 32-bit — plain `*` overflows
  //    into float and silently produces a different hash;
  //  - the finalisation assigns h1 FIRST and h2 then reads the NEW h1;
  //  - the value is a 53-bit safe integer, so `toString(16)` is exact;
  //  - `padStart(14, '0')` then `slice(-12)` keeps the LOW 12 hex digits,
  //    i.e. the low 48 bits — it is a truncation, not a re-hash;
  //  - iteration is over UTF-16 CODE UNITS (`charCodeAt`), so an astral
  //    character contributes its two surrogates. Do not "fix" this to
  //    code points: it would break equivalence with the payload.

  // quietly hash the empty string (`(5).length` is undefined, so its loop never
  // runs). An anchor is durable data, so a non-string here is a caller bug and
  // is thrown rather than encoded.
  function fileHash12(text) {
    if (typeof text !== 'string') {
      throw new TypeError('fileHash12 expects a string, got ' + typeof text);
    }
    let h1 = -559038737; // 0xdeadbeef as a signed 32-bit integer
    let h2 = 1103547991; // 0x41c6ce57
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ code, 2654435761);
      h2 = Math.imul(h2 ^ code, 1597334677);
    }
    h1 =
      Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^
      Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 =
      Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^
      Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    // 4294967296 === 2 ** 32; 2097151 === 2 ** 21 - 1. Together: 53 bits.
    const value = 4294967296 * (2097151 & h2) + (h1 >>> 0);
    return value.toString(16).padStart(14, '0').slice(-FILE_HASH_HEX);
  }

  // --- fraction4 (payload `ZP`) ---------------------------------------------
  //
  // CONTRACT §4.2 states this as `String(Math.round(clamp01(v) * 9999)).padStart(4,'0')`
  // and leaves the non-finite case open. The payload closes it: a non-finite
  // value becomes 0.5 (the artboard centre) BEFORE the clamp. That matters —
  // clamping NaN yields NaN, and `String(Math.round(NaN)).padStart(4,'0')` is
  // the literal string "0NaN", which would mint an anchor the payload's own
  // parser rejects. This port keeps the payload's guard.
  //
  // Note `Number.isFinite` is not coercing: the string "0.5" is NOT finite by
  // it and falls back to the 0.5 default. That is the payload's behaviour and
  // is reproduced exactly; pass numbers.
  function fraction4(value) {
    const finite = Number.isFinite(value) ? value : 0.5;
    const clamped = Math.min(1, Math.max(0, finite));
    return String(Math.round(clamped * FRACTION_SCALE)).padStart(
      FRACTION_DIGITS,

  // trip is exact only to 1/9999.
  function fractionFrom4(digits) {

  // --- anchor construction (payload `QP`, and the artboard branch of `dE`) ---

  function anchorSegment(kind, payload) {
    return 'dc' + kind + payload + ':nth-of-type(' + String(NTH_OF_TYPE) + ')';
  }

  // `filePath` is the artboard's file path exactly as the canvas knows it
  // (e.g. "Pricing.dc.html"); fx/fy are fractions of the artboard box.
  // Returns null rather than an invalid string if validation fails, mirroring
  // the payload's own mint site, which also ends in a validate-or-null.

      KIND_ARTBOARD,
      fileHash12(filePath) + fraction4(fx) + fraction4(fy),

  //
  // Applies in BOTH directions: to anything minted here before it becomes
  // durable data, and to anything read back out of an anchor store. The
  // web-chat server stores `anchor` verbatim with zero validation and
  // `describeAnchor` does not truncate `selector`, so an unbounded or malformed
  // anchor read from the frame would flow straight into Claude's context.

    if (typeof anchor !== 'string') {
      return { ok: false, reason: 'anchor is not a string' };
    }

      return { ok: false, reason: 'anchor is empty' };
    }
    if (anchor.length > MAX_ANCHOR_LENGTH) {
      return {
        ok: false,
        reason:
          'anchor is ' +
          anchor.length +
          ' chars, over the ' +
          MAX_ANCHOR_LENGTH +
          '-char limit',
      };

    if (segments.length > MAX_ANCHOR_SEGMENTS) {
      return {
        ok: false,
        reason:
          'anchor has ' +
          segments.length +
          ' segments, over the limit of ' +
          MAX_ANCHOR_SEGMENTS,
      };
    }
    const last = segments[segments.length - 1];
    const match = FINAL_SEGMENT_RE.exec(last);
    if (!match) {
      return {
        ok: false,
        reason: 'final segment does not match the anchor grammar',
      };
    }
    if (Number(match[3]) !== NTH_OF_TYPE) {
      return {
        ok: false,
        reason:
          'final segment is :nth-of-type(' +
          match[3] +
          '); the grammar admits only ' +
          NTH_OF_TYPE,
      };
    }
    if (strict) {
      for (let i = 0; i < segments.length; i++) {
        const segment = segments[i];

          PLAIN_SEGMENT_RE.test(segment) ||
          (i === 0 && ID_SEGMENT_RE.test(segment));
        if (!okSegment) {
          return { ok: false, reason: 'segment ' + i + ' is not a valid selector' };
        }

    return { ok: true, reason: null, kind: match[1], payload: match[2] };
  }

    return validateAnchor(anchor, options).ok;
  }

  //
  // Returns { fileHash12, fx, fy } for a canonical single-segment artboard
  // anchor, else null. Deliberately narrow: v0.1.0 mints only 'a' anchors, and
  // anything else read out of a store is not ours and is not decoded here.
  function parseArtboardAnchor(anchor) {
    const check = validateAnchor(anchor);
    if (!check.ok) return null;
    if (check.kind !== KIND_ARTBOARD) return null;
    if (anchor.split(SEGMENT_SEPARATOR).length !== 1) return null;
    const parts = HASH_AND_FRACTIONS_RE.exec(check.payload);
    if (!parts) return null;
    return {
      kind: KIND_ARTBOARD,
      fileHash12: parts[1],
      fx: fractionFrom4(parts[2]),
      fy: fractionFrom4(parts[3]),
      fx4: parts[2],
      fy4: parts[3],
    };
  }

  return {
    FILE_HASH_HEX,
    FRACTION_SCALE,
    FRACTION_DIGITS,
    NTH_OF_TYPE,
    KIND_ELEMENT,
    KIND_ARTBOARD,
    KIND_NOTE,
    KIND_CANVAS_POINT,
    SEGMENT_SEPARATOR,
    MAX_ANCHOR_LENGTH,
    MAX_ANCHOR_SEGMENTS,
    FINAL_SEGMENT_RE,
    PLAIN_SEGMENT_RE,
    ID_SEGMENT_RE,
    fileHash12,
    fraction4,
    fractionFrom4,
    anchorSegment,
    artboardAnchor,
    validateAnchor,
    isValidAnchor,
    parseArtboardAnchor,
  };
})();

  function stopAll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }
  // Offline: a node preview and a frozen export both run this script with no
  // daemon behind them, so store writes and API calls go nowhere. Say so on the
  // buttons rather than letting them look live and do nothing.
  const offline = () => IS_PREVIEW || loadState === 'net';

  function flash(text, bad) {
    els.flash.textContent = s(text);
    els.flash.className = 'dc-flash' + (bad ? ' bad' : '');
    if (flashTimer) clearTimeout(flashTimer);
    if (text) flashTimer = setTimeout(() => { els.flash.textContent = ''; }, 6000);
  }

  // A store write is adopted only when its seq strictly increases, so a replayed
  // snapshot (node navigation, a reconnect) cannot walk the pane backwards.
  //
  // With ONE exception, and it is load-bearing. This pane script outlives its own
  // service: the supervisor stops a service child whenever the last browser stops
  // watching (services.js:133, fed by the WS client count) and respawns it when
  // one returns — while the reconnect handshake is
  // `applySnapshot(msg, {mode:'reconcile'})` (public/app/ws.js:137), which keeps
  // a pane whose spec is unchanged MOUNTED (public/app/mounts.js:746-751). A
  // fresh child that restarted its counter therefore publishes below our
  // high-water mark, and a strict guard would drop every one of its writes
  // forever: a canvas that looks fine, ignores the disk, and answers Reseed with
  // nothing. service.js adopts a seq floor from the store to stop that at source;
  // this is the other half, because the pane cannot assume its writer is ours.
  //
  // A REPEAT (q === lastSeq) is still refused — that is what a replay looks like,
  // and it is the case the guard was written for. Only a strict REGRESSION is
  // read as "a new writer started counting again", and adopting it is safe
  // because the server's store is authoritative: a lower seq cannot arrive from
  // behind (syncStore only publishes keys that differ from what this client
  // already holds, mounts.js:793-800).
  function accept(key, p) {
    if (!p || typeof p !== 'object') return false;
    const q = num(p.seq);
    if (q != null) {
      if (q === lastSeq[key]) return false;
      if (q < lastSeq[key]) console.warn('design-canvas: ' + key + ' seq went backwards (' +
        lastSeq[key] + ' → ' + q + '); treating it as a restarted service, not a replay.');
      lastSeq[key] = q;
    }
    return true;
  }

  // dsn_ctl and dsn_ask both need a strictly increasing seq, and a remount must
  // never restart below one already spent — so outrank both our own counter and
  // whatever is sitting in the store right now.
  let seqFloor = Date.now();
  function nextSeq(key) {
    let floor = seqFloor;
    try {
      const cur = store.get(key), prev = cur ? num(cur.seq) : null;
      if (prev != null && prev > floor) floor = prev;
    } catch (e) { /* store unavailable: our own counter is enough */ }
    const now = Date.now();
    seqFloor = now > floor ? now : floor + 1;
    return seqFloor;
  }
  // CONTROL key. The service watches it over SSE and reacts; this does NOT wake
  // Claude (CONTRACT §2.3) — it is a service reaction, not a declared signal.
  function sendCtl(op) {
    if (offline()) { flash('No daemon is listening here, so ' + op + ' cannot be sent.', true); return false; }
    try { store.set({ dsn_ctl: { seq: nextSeq('dsn_ctl'), op: op } }); return true; }
    catch (e) { flash('Could not write dsn_ctl: ' + s(e && e.message), true); return false; }
  }

  // ── the artboard index — ours, from the store, never the frame's ─────────
  const artboards = () => arr(canvas && canvas.artboards).filter((a) => a && s(a.file));
  function artboardSpec(file) {
    for (const a of artboards()) if (s(a.file) === s(file)) return a;
    return null;
  }
  const indexHas = (file) => !!artboardSpec(file);
  function hashOf(file) {
    const k = s(file);
    if (!hashes.has(k)) hashes.set(k, A.fileHash12(k));
    return hashes.get(k);
  }

  // ═════════════════════════════════════════════════════════════════════════
  // HEADER
  // ═════════════════════════════════════════════════════════════════════════
  const STATE_LABEL = {
    ready: ['ready', 'ok'], seeding: ['seeding', 'work'],
    'no-payload': ['no payload', 'bad'], 'bad-dir': ['bad dir', 'bad'],
    'seed-failed': ['seed failed', 'bad'], 'live-store': ['live store', 'bad'],
  };
  function paintHead() {
    const title = s(canvas && canvas.title) || s(P.title) || 'Design canvas';
    els.title.textContent = title;
    els.title.title = title;

    let label = 'waiting', tone = '', tip = 'No dsn_canvas in the store yet.';
    if (canvas) {
      const st = s(canvas.state);
      const pair = STATE_LABEL[st] || [st || 'unknown', canvas.ok === false ? 'bad' : ''];
      label = pair[0]; tone = pair[1];
      tip = 'dsn_canvas.state = ' + (st || '(none)') + '  ·  ok = ' + String(canvas.ok !== false);
    }
    if (IS_PREVIEW) { label = 'preview'; tone = ''; tip = 'A still of a graph node: no frame, no fetch.'; }
    els.badge.textContent = label;
    els.badge.className = 'dc-badge' + (tone ? ' ' + tone : '');
    els.badge.title = tip;
    paintSaveBadge();

    els.sub.replaceChildren();
    const bits = [];
    const n = artboards().length;
    if (n) bits.push([String(n), ' artboard' + (n === 1 ? '' : 's')]);
    const f = arr(files && files.files).length;
    if (f) bits.push([String(f), ' file' + (f === 1 ? '' : 's') + ' on disk']);
    if (canvas && canvas.bytes) bits.push([fmtBytes(canvas.bytes), ' canvas']);
    if (canvas && canvas.seeded_at) bits.push([relTime(canvas.seeded_at), ' seeded']);
    const up = obj(canvas && canvas.upstream);
    if (up && up.version) bits.push(['Claude Code ' + s(up.version), '']);
    for (let i = 0; i < bits.length; i++) {
      if (i) els.sub.appendChild(document.createTextNode('·'));
      const span = el('span');
      span.appendChild(el('b', null, bits[i][0]));
      if (bits[i][1]) span.appendChild(document.createTextNode(bits[i][1]));
      els.sub.appendChild(span);
    }
    if (up && up.payload_sha256) {
      const sha = el('span', null, 'payload ' + s(up.payload_sha256).slice(0, 8));
      sha.title = 'sha256 ' + s(up.payload_sha256);
      els.sub.appendChild(document.createTextNode('·'));
      els.sub.appendChild(sha);
    }

    const canPin = loadState === 'ok' && !ISOLATE && !IS_PREVIEW;
    els.pinBtn.disabled = !canPin;
    els.pinBtn.className = 'dc-btn dc-btn-s' + (armed ? ' on' : '');
    els.pinBtn.textContent = armed ? 'Pin mode: on' : 'Pin mode';
    els.pinBtn.title = ISOLATE
      ? 'Off in isolate mode: an opaque-origin frame cannot be read, so there is no artboard geometry to pin against.'
      : (canPin
        ? 'Arm a click-to-pin overlay over the canvas. While it is armed the canvas cannot be panned or zoomed.'
        : 'Available once the canvas is on screen.');
    // Held while a Save is in flight: a re-seed remounts the frame, and doing
    // that to a document the user is part-way through writing to disk is the
    // one interleaving that could look like lost work.
    const saving = saveState.phase === 'saving';
    els.reseedBtn.disabled = offline() || saving;
    els.reseedBtn.title = saving
      ? 'Waiting for the Save in flight to finish.'
      : offline()
      ? 'Nothing is listening here — this is a snapshot, not the live surface.'
      : 'Re-run the seeding helper over the current files (dsn_ctl op reseed). Always safe.';
    els.askBtn.disabled = offline();
    els.askBtn.title = offline()
      ? 'Nothing is listening here — this is a snapshot, not the live surface.'
      : (ASK_DECLARED
        ? 'Write a note on dsn_ask, the pane’s one declared signal. It waits in the queue rail until you Push (P).'
        : 'dsn_ask is not declared as a signal on this mount, so a note written here does not reach the queue rail. ' + ASK_UNDECLARED_WHY);
    els.filesBtn.className = 'dc-btn dc-btn-s' + (filesOpen ? ' on' : '');
    els.askBtn.className = 'dc-btn dc-btn-s dc-btn-go' + (askOpen ? ' on' : '');

    paintBanner();
    paintFiles();
    paintAsk();
  }

  function bn(kind, iconName, parts) {
    const b = el('div', 'dc-bn' + (kind ? ' ' + kind : ''));
    b.appendChild(icon(iconName));
    b.appendChild(line(el('div'), parts));
    return b;
  }

  // ── framing: where each artboard's frame size came from ──────────────────
  //
  // `dsn_canvas.layout` and `dsn_canvas.frames` (CONTRACT §2.1) are the service
  // saying how it arrived at each `w`×`h`. It earns a line on screen because of
  // what the editor does when nobody tells it: an artboard nothing sizes is framed
  // at a silent 800×600 — the helper does not warn either, since its numeric check
  // only reports an x/y/w/h that is present and non-numeric. A 1288-wide design in
  // an 800×600 frame is drawn small (fit never scales up) or clipped with no way to
  // reach the rest (fill, because a seeded artboard document is pinned by
  // `html,body{height:100%}` and the canvas gives it no scroller). Neither state
  // explains itself. This does.
  //
  // §2.1: "The pane MUST surface `source` next to the size." A frame that is a
  // guess has to look like a guess.
  const FRAME_SOURCE = {
    'canvas.json': 'you wrote it in canvas.json',
    '$preview': 'the design’s own $preview hint',
    'root-style': 'the root element’s own px size',
    'param': 'the frame_w / frame_h params',
    'wide-scan': 'the widest px width in the file — a guess',
    'default': 'a fallback — nothing in the file gave a size',
  };
  // `source: null` is not a missing value, it is a finding: nothing sized this
  // artboard, so the editor's own default is what it gets.
  const NO_SOURCE = 'nothing sized it — the editor’s own default';
  // The rungs that are inference rather than declaration, plus the un-sized case.
  // They set the tone of the banner, because they are the ones that can be wrong.
  const FRAME_GUESSED = { 'wide-scan': 1, 'default': 1 };
  const sourceText = (src) => (src ? (FRAME_SOURCE[src] || src) : NO_SOURCE);
  // What the editor frames an artboard at when the manifest does not (payload
  // constants jT/GT, applied by its own normaliser).
  const DEFAULT_FRAME = '800 × 600';
  function frames() {
    return arr(canvas && canvas.frames).filter((f) => f && s(f.file)).map((f) => ({
      // Same discipline as everything else that names an artboard: prefer OUR
      // index, and cap anything that is not in it (CONTRACT §4.4, §9.3).
      file: indexHas(s(f.file)) ? s(f.file) : capFrame(f.file),
      w: px(f.w), h: px(f.h),
      source: f.source == null ? null : s(f.source),
      expand: f.expand == null ? null : s(f.expand),
    }));
  }
  function frameFor(file) {
    for (const f of frames()) if (f.file === s(file)) return f;
    return null;
  }
  // The lead sentence is chosen by `layout`, not guessed from the rows: "we
  // generated this" and "we filled the gaps you left" are different claims about
  // the user's own file, and only one of them is ever true.
  const LAYOUT_LEAD = {
    synthesised: ['There is no ', ['code', null, 'canvas.json'],
      ' in the working folder, so this pack generated the layout — including the frame each artboard is drawn at. '],
    'user-filled': ['Your ', ['code', null, 'canvas.json'],
      ' left some keys out, so this pack filled in those and only those; everything you wrote was passed through untouched. '],
    none: ['There is no ', ['code', null, 'canvas.json'], ' and no layout was generated, so every artboard is framed at the editor’s own default. '],
  };
  function framingBanner() {
    const lead = LAYOUT_LEAD[s(canvas && canvas.layout)];
    if (!lead) return null;                       // "user", or no seed yet
    const rows = frames().filter((f) => f.source !== 'canvas.json');
    const guessed = rows.some((f) => !f.source || FRAME_GUESSED[f.source]);
    const b = el('div', 'dc-bn' + (guessed ? ' warn' : ''));
    b.appendChild(icon(guessed ? 'warn' : 'info'));
    const t = el('div');
    line(t, lead.concat(['That default is ', ['code', null, DEFAULT_FRAME],
      ', applied silently, which is what makes a wide design look shrunk — or clipped, with nothing to scroll.']));
    if (rows.length) {
      const g = el('div', 'dc-frames');
      for (const f of rows.slice(0, 8)) {
        const n = el('div', 'f', f.file);
        n.title = f.file;
        g.appendChild(n);
        g.appendChild(el('div', 'd', f.w != null && f.h != null
          ? Math.round(f.w) + ' × ' + Math.round(f.h) : DEFAULT_FRAME));
        g.appendChild(el('div', 's', sourceText(f.source) + (f.expand === 'fill' ? ' · fill' : '')));
      }
      t.appendChild(g);
      if (rows.length > 8) t.appendChild(el('div', 'dc-fine', '+ ' + (rows.length - 8) + ' more'));
    }
    t.appendChild(line(el('div', 'dc-fine'), ['Yours to take over: write the size into a ',
      ['code', null, 'canvas.json'], ' in that folder — an explicit one always wins — or ask Claude to re-mount this pane with ',
      ['code', null, 'frame_w'], ' / ', ['code', null, 'frame_h'], '.']));
    b.appendChild(t);
    return b;
  }

  // The helper's entry-artboard warning, made actionable. Verbatim it reads
  //   no --artboard is Main.dc.html — the editor will treat X as the entry
  //   artboard; name the entry Main.dc.html unless you are re-seeding …
  // which is accurate, correct, and completely inert on screen: it was shown to a
  // user who then did not act on it. The fix is a single rename, so lead with the
  // rename. Matched on the stable head of the string, never on its punctuation —
  // the em dash and the wording after it are the helper's to change.
  const ENTRY_MARK = 'no --artboard is Main.dc.html';
  function entryArtboardName(w) {
    const i = w.indexOf('will treat ');
    const j = w.indexOf(' as the entry artboard');
    if (i < 0 || j <= i + 11) return '';
    const raw = w.slice(i + 11, j).trim();
    return indexHas(raw) ? raw : capFrame(raw);
  }
  function entryBanner(text) {
    const name = entryArtboardName(text);
    const b = el('div', 'dc-bn warn');
    b.appendChild(icon('warn'));
    const t = el('div');
    t.appendChild(el('b', null, 'Nothing here is called Main.dc.html.'));
    line(t, [' The editor picks its entry artboard by ', ['b', null, 'name'], ', not by order, so it opens ',
      name ? ['code', null, name] : 'whichever artboard the helper saw first',
      ' instead. Rename the one that should open first to ', ['code', null, 'Main.dc.html'],
      ' and reseed — unless you are re-seeding a canvas whose Main was deleted, in which case this is expected.']);
    b.appendChild(t);
    return b;
  }

  function paintBanner() {
    const out = [];
    // The one thing that must not scroll past: what the last Save did to files
    // on disk. First, above everything informational.
    const srb = saveResultBanner();
    if (srb) out.push(srb);
    if (ISOLATE && !IS_PREVIEW) {
      out.push(bn('', 'off', ['Isolate mode: the canvas frame is sandboxed to an opaque origin, so it is viewer-only — ',
        ['b', null, 'pins are off and there is no Save'],
        '. No host object is installed in an isolated frame, so the editor boots read-only by its own design (CONTRACT §9.5); ',
        'nothing inside it can reach this daemon, and nothing here can read its artboard geometry. Remount without ',
        ['code', null, 'isolate'], ' to edit.']));
    }
    if (!SECURE && !IS_PREVIEW) {
      out.push(bn('warn', 'warn', ['This surface is not a secure context (', ['code', null, ORIGIN || 'this origin'],
        '), so the canvas cannot run here. Open it on ', ['code', null, 'http://localhost'], ' or ',
        ['code', null, 'http://127.0.0.1'], ' instead.']));
    }
    if (booted === false) {
      out.push(bn('warn', 'warn', ['The canvas loaded but no artboards appeared in it. Reseed, or ask Claude to run the helper’s ',
        ['code', null, '--check'], ' over the working files.']));
    }
    const eb = editBanner();
    if (eb) out.push(eb);
    // Additive fields the service publishes beyond CONTRACT §2.1/§2.2. A canvas
    // that seeded with warnings is not a canvas that seeded cleanly, and the
    // helper's advisory stderr is the only place that difference is visible.
    //
    // The entry-artboard one is lifted out and rewritten as an instruction; the
    // rest stay verbatim, because paraphrasing the helper loses the fix.
    const warns = arr(canvas && canvas.warnings).map((w) => s(w).trim()).filter(Boolean);
    const entry = warns.filter((w) => w.indexOf(ENTRY_MARK) >= 0);
    const rest = warns.filter((w) => w.indexOf(ENTRY_MARK) < 0);
    if (entry.length) out.push(entryBanner(entry[0]));
    if (rest.length) {
      const b = el('div', 'dc-bn warn');
      b.appendChild(icon('warn'));
      const t = el('div');
      t.appendChild(el('b', null, 'The helper seeded this canvas, with warnings.'));
      for (const w of rest.slice(0, 5)) t.appendChild(el('div', 'dc-mono', w.slice(0, 400)));
      if (rest.length > 5) t.appendChild(el('div', 'dc-fine', '+ ' + (rest.length - 5) + ' more'));
      b.appendChild(t);
      out.push(b);
    }
    // Last of the informational banners, because it explains a picture the user
    // can already see rather than a thing they must fix.
    const fb = framingBanner();
    if (fb) out.push(fb);
    if (!canvas && escalated) {
      out.push(bn('warn', 'warn', ['Nothing from the design-canvas service yet. If it has not been approved on this machine, run ',
        ['code', null, TRUST],
        ' in your terminal — a pane can name that command but cannot grant it. A service also runs only while its pane is on the active node with a browser watching.']));
    }
    els.banner.hidden = !out.length;
    els.banner.replaceChildren.apply(els.banner, out);
  }

  function paintFiles() {
    els.files.hidden = !filesOpen;
    if (!filesOpen) return;
    const box = els.files;
    box.replaceChildren();
    box.appendChild(el('h4', null, 'Working files'));
    const dir = s(files && files.dir);
    if (dir) { const d = el('div', 'dc-what', dir); d.title = dir; box.appendChild(d); }
    const list = arr(files && files.files);
    if (!list.length) {
      box.appendChild(el('div', 'dc-fine', files
        ? 'The service reports no files in that directory.'
        : 'The service has not published dsn_files yet.'));
    } else {
      const grid = el('div', 'dc-flist');
      for (const f of list.slice(0, 200)) {
        const n = el('div', 'n', s(f.name));
        n.title = s(f.name);
        grid.appendChild(n);
        grid.appendChild(el('div', 'v', fmtBytes(f.bytes)));
        grid.appendChild(el('div', 'v', relTime(f.mtime)));
      }
      box.appendChild(grid);
    }
    // A file sitting in the folder that is NOT on the canvas is exactly the kind
    // of silence this pack is written against, so the service's reasons are shown.
    const skipped = arr(files && files.skipped);
    if (skipped.length) {
      box.appendChild(el('div', 'dc-fine', 'In the folder, but not on the canvas:'));
      for (const sk of skipped.slice(0, 20)) {
        const row = el('div', 'dc-fine');
        row.appendChild(el('b', null, s(sk.name)));
        row.appendChild(document.createTextNode(' — ' + s(sk.reason).slice(0, 200)));
        box.appendChild(row);
      }
      if (skipped.length > 20) box.appendChild(el('div', 'dc-fine', '+ ' + (skipped.length - 20) + ' more'));
    }
    const row = el('div', 'dc-row');
    const re = btn('dc-btn dc-btn-s', 'Re-read the directory');
    re.addEventListener('click', () => { if (sendCtl('rescan')) flash('Asked the service to re-read the directory (dsn_ctl op rescan).'); });
    row.appendChild(re);
    row.appendChild(el('span', 'dc-fine',
      (files && files.has_canvas_json
        ? 'canvas.json is present, so the layout is yours. '
        : 'No canvas.json — the helper lays the artboards out itself. ') +
      (P.watch === false || P.watch === 'false'
        ? 'This pane was mounted with watch:false, so edits on disk do NOT re-seed on their own — use Reseed. '
        : 'Edits to these files re-seed the canvas on their own. ') +
      'Nothing on this surface ever writes to that directory.'));
    box.appendChild(row);
  }

  // ── ask panel: the ONE declared signal (CONTRACT §2.4) ───────────────────
  function paintAsk() {
    els.ask.hidden = !askOpen;
    if (!askOpen) return;
    const n = artboards().length;
    els.askWhat.textContent = [s(canvas && canvas.title) || s(P.title) || '(untitled)',
      n + ' artboard' + (n === 1 ? '' : 's'),
      'state ' + (s(canvas && canvas.state) || 'unknown')].join('  ·  ');
    const want = els.askBoard.value;
    const sig = artboards().map((a) => s(a.file)).join('|');
    if (els.askBoard._sig !== sig) {
      els.askBoard._sig = sig;
      els.askBoard.replaceChildren();
      const all = el('option', null, 'the whole canvas');
      all.value = '';
      els.askBoard.appendChild(all);
      for (const a of artboards()) {
        const o = el('option', null, s(a.file));
        o.value = s(a.file);
        els.askBoard.appendChild(o);
      }
      els.askBoard.value = want;
      if (els.askBoard.value !== want) els.askBoard.value = '';
    }
  }
  function openAsk(prefillNote, artboard) {
    askOpen = true;
    paintAsk();
    if (artboard) els.askBoard.value = artboard;
    if (prefillNote && !els.askNote.value.trim()) {
      els.askNote.value = String(prefillNote);
      // A programmatic write fires nothing on its own, and composed:true is what
      // carries the event through the shadow boundary to the shell's form-state
      // capture — without it the note would not survive a refresh.
      els.askNote.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
    }
    paintHead();
    els.askNote.focus();
  }
  function sendAsk() {
    const board = s(els.askBoard.value);
    const payload = {
      seq: nextSeq('dsn_ask'),
      note: String(els.askNote.value || '').slice(0, 2000),
      artboard: board || null,
    };
    try { store.set({ dsn_ask: payload }); }
    catch (e) { return flash('Could not write dsn_ask: ' + s(e && e.message), true); }
    els.askNote.value = '';
    els.askNote.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
    els.askNote.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
    askOpen = false;
    paintHead();
    // Only claim the handoff that will actually happen. Without the declaration
    // this write reaches nothing at all (see ASK_DECLARED), and an empty queue
    // rail after a confident "queued" is worse than no button.
    flash(ASK_DECLARED
      ? 'Queued on dsn_ask — hit Push (P) in the right-hand rail to hand it over.'
      : 'Written to dsn_ask, but NOT queued. ' + ASK_UNDECLARED_WHY, !ASK_DECLARED);
  }

  els.askBtn.addEventListener('click', () => {
    if (askOpen) { askOpen = false; paintHead(); } else openAsk();
  });
  els.ask.querySelector('[data-ask-cancel]').addEventListener('click', () => { askOpen = false; paintHead(); });
  els.ask.querySelector('[data-ask-send]').addEventListener('click', sendAsk);
  els.filesBtn.addEventListener('click', () => { filesOpen = !filesOpen; paintHead(); });
  els.reseedBtn.addEventListener('click', () => {
    if (sendCtl('reseed')) flash('Asked the service to re-seed. The frame reloads when it publishes.');
  });
  els.pinBtn.addEventListener('click', () => setArmed(!armed));

  // ═════════════════════════════════════════════════════════════════════════
  // STATE SCREENS — every state gets a distinct, useful one (CONTRACT §3)
  // ═════════════════════════════════════════════════════════════════════════
  function screen(kind, iconName, head, paras) {
    const box = el('div', 'dc-screen' + (kind ? ' ' + kind : ''));
    box.appendChild(icon(iconName, 'dc-ic-b'));
    box.appendChild(el('div', 'dc-h', head));
    for (const p of arr(paras)) box.appendChild(line(el('p', 'dc-p'), Array.isArray(p) ? p : [p]));
    return box;
  }
  function bar() { const b = el('div', 'dc-bar'); b.appendChild(el('i')); return b; }
  function actions(box, specs) {
    const row = el('div', 'dc-btns');
    for (const spec of specs) {
      if (!spec || !spec[0]) continue;
